<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>랍땡이의 레퍼런스 창고</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-28">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 px-4 sm:px-8 py-3.5 shadow-sm">
    <div class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl sm:text-2xl">📁</span>
        <h1 class="text-base sm:text-xl font-black tracking-tight bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-transparent">
          랍땡이의 레퍼런스 창고
        </h1>
      </div>
      <button onclick="openModal()" class="flex items-center gap-1.5 px-3.5 sm:px-5 py-2 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-full text-xs font-bold shadow-md transition">
        <span>+</span> 레퍼런스 추가
      </button>
    </div>

    <!-- 검색 및 태그 필터 -->
    <div class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto mt-3 space-y-2">
      <div class="relative">
        <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍 레퍼런스 제목, 태그, 메모 검색..." class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-transparent dark:border-slate-700">
      </div>
      <div id="tagFilterList" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1"></div>
    </div>
  </header>

  <main class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto p-4 sm:p-6">
    <!-- 카드 리스트 출력 영역 (모바일: 1열, PC: 널찍한 그리드) -->
    <div id="referenceList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  </main>

  <!-- 📝 레퍼런스 등록/수정 모달 -->
  <div id="refModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl w-full max-w-md sm:max-w-lg p-6 space-y-4 max-h-[88vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b">
        <h2 id="modalTitle" class="text-base font-extrabold">📁 레퍼런스 등록</h2>
        <button onclick="closeModal()" class="text-xl font-bold text-slate-400 hover:text-slate-600">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">레퍼런스 제목</label>
          <input type="text" id="inputTitle" placeholder="예: 캡컷 사라지는 글자 효과" class="w-full px-3.5 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
        </div>

        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">🔗 원본 URL 링크</label>
          <input type="url" id="inputUrl" placeholder="https://www.instagram.com/p/..." class="w-full px-3.5 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
        </div>

        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">🏷️ 태그 (쉼표로 구분)</label>
          <input type="text" id="inputTags" placeholder="예: 릴스, 캡컷, 텍스트효과" class="w-full px-3.5 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
        </div>

        <!-- 📷 이미지 다중 첨부 (복사/붙여넣기 및 파일선택) -->
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">📷 이미지 캡처/첨부 (여러 장 붙여넣기 가능)</label>
          <div id="imageDropArea" class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-4 text-center cursor-pointer hover:border-indigo-500 transition bg-slate-50 dark:bg-slate-800/50" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event)">
            <div id="uploadPrompt" class="space-y-1">
              <span class="text-xl block">🖼️</span>
              <p class="font-bold text-slate-600 dark:text-slate-300">클릭하여 이미지 선택 또는 <span class="text-indigo-600">Ctrl+V</span>로 붙여넣기</p>
            </div>
          </div>
          <!-- 이미지 썸네일 표시 목록 -->
          <div id="previewList" class="flex flex-wrap gap-2 mt-2"></div>
        </div>

        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">📝 인사이트 메모</label>
          <textarea id="inputMemo" rows="3" placeholder="참고할 시각 포인트나 벤치마킹할 아이디어를 적어두세요." class="w-full px-3.5 py-2.5 border rounded-xl dark:bg-slate-800 resize-none focus:outline-none"></textarea>
        </div>
      </div>

      <button onclick="saveReference()" id="saveBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-extrabold rounded-2xl text-xs shadow-lg transition">
        저장하기
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let referenceList = [];
    let selectedTag = 'ALL';
    let editingId = null;
    let imageList = [];

    // 클립보드 이미지 붙여넣기
    window.addEventListener('paste', function(e) {
      const modal = document.getElementById('refModal');
      if (modal.classList.contains('hidden')) return;

      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          readAndAddImage(blob);
        }
      }
    });

    function handleFileSelect(e) {
      const files = e.target.files;
      if (files) {
        Array.from(files).forEach(file => readAndAddImage(file));
      }
    }

    function readAndAddImage(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imageList.push(e.target.result);
        renderImagePreviews();
      };
      reader.readAsDataURL(file);
    }

    function removeImage(index) {
      imageList.splice(index, 1);
      renderImagePreviews();
    }

    function renderImagePreviews() {
      const container = document.getElementById('previewList');
      if (imageList.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = imageList.map((img, idx) => `
        <div class="relative w-16 h-16 rounded-xl border overflow-hidden group">
          <img src="${img}" class="w-full h-full object-cover">
          <button type="button" onclick="removeImage(${idx})" class="absolute top-0 right-0 bg-rose-500 text-white w-4 h-4 text-[10px] flex items-center justify-center font-bold rounded-bl-lg">&times;</button>
        </div>
      `).join('');
    }

    function openModal(item = null) {
      if (item) {
        editingId = item.id;
        document.getElementById('modalTitle').innerText = '✏️ 레퍼런스 수정';
        document.getElementById('saveBtn').innerText = '수정 완료';
        document.getElementById('inputTitle').value = item.title || '';
        document.getElementById('inputUrl').value = item.url || '';
        document.getElementById('inputTags').value = (item.tags || []).join(', ');
        document.getElementById('inputMemo').value = item.memo || '';
        
        imageList = [];
        if (item.image_urls && item.image_urls.length > 0) {
          imageList = [...item.image_urls];
        } else if (item.image_url) {
          imageList = [item.image_url];
        }
        renderImagePreviews();
      } else {
        editingId = null;
        document.getElementById('modalTitle').innerText = '📁 레퍼런스 등록';
        document.getElementById('saveBtn').innerText = '저장하기';
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputUrl').value = '';
        document.getElementById('inputTags').value = '';
        document.getElementById('inputMemo').value = '';
        imageList = [];
        renderImagePreviews();
      }
      document.getElementById('refModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('refModal').classList.add('hidden');
    }

    async function saveReference() {
      const title = document.getElementById('inputTitle').value;
      const url = document.getElementById('inputUrl').value;
      const tagsRaw = document.getElementById('inputTags').value;
      const memo = document.getElementById('inputMemo').value;

      if (!title) return alert('제목을 입력해주세요.');

      const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);

      const payload = { 
        title, 
        url, 
        tags, 
        image_urls: imageList, 
        image_url: imageList[0] || null,
        memo 
      };

      if (editingId) {
        await supabaseClient.from('references').update(payload).eq('id', editingId);
      } else {
        await supabaseClient.from('references').insert([payload]);
      }

      closeModal();
      loadData();
    }

    async function deleteItem(id, event) {
      if (event) event.stopPropagation();
      if (!confirm('삭제하시겠습니까?')) return;
      await supabaseClient.from('references').delete().eq('id', id);
      loadData();
    }

    async function loadData() {
      const { data } = await supabaseClient.from('references').select('*');
      referenceList = (data || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      renderTagFilters();
      renderList();
    }

    function renderTagFilters() {
      const tagSet = new Set();
      referenceList.forEach(item => {
        (item.tags || []).forEach(t => tagSet.add(t));
      });

      const container = document.getElementById('tagFilterList');
      const tags = Array.from(tagSet);

      let html = `
        <button onclick="filterByTag('ALL')" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedTag === 'ALL' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}">
          전체 보기
        </button>
      `;

      tags.forEach(t => {
        html += `
          <button onclick="filterByTag('${t}')" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedTag === t ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}">
            #${t}
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function filterByTag(tag) {
      selectedTag = tag;
      renderTagFilters();
      renderList();
    }

    function renderList() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('referenceList');

      const filtered = referenceList.filter(item => {
        const matchesTag = selectedTag === 'ALL' || (item.tags || []).includes(selectedTag);
        const matchesSearch = (item.title || '').toLowerCase().includes(search) || 
                              (item.memo || '').toLowerCase().includes(search) || 
                              (item.tags || []).some(t => t.toLowerCase().includes(search));
        return matchesTag && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center py-16 text-xs text-slate-400 font-medium">저장된 레퍼런스가 없습니다.</p>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const imgs = (item.image_urls && item.image_urls.length > 0) ? item.image_urls : (item.image_url ? [item.image_url] : []);

        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              ${imgs.length > 0 ? `
                <div class="flex overflow-x-auto no-scrollbar gap-1 p-1 bg-slate-100 dark:bg-slate-800 snap-x">
                  ${imgs.map(img => `
                    <div class="h-48 flex-shrink-0 w-full snap-center rounded-xl overflow-hidden">
                      <img src="${img}" class="w-full h-full object-cover">
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              <div class="p-4 sm:p-5 space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <h3 class="font-extrabold text-sm text-slate-900 dark:text-white leading-snug">${item.title}</h3>
                  <div class="flex items-center gap-1 flex-shrink-0">
                    <button onclick='openModal(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="p-1 text-slate-400 hover:text-indigo-600 text-xs font-bold transition">✏️</button>
                    <button onclick="deleteItem(${item.id}, event)" class="p-1 text-slate-300 hover:text-rose-500 text-base font-bold transition">&times;</button>
                  </div>
                </div>

                ${item.memo ? `
                  <p class="text-xs text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800 leading-relaxed whitespace-pre-line">${item.memo}</p>
                ` : ''}

                ${(item.tags && item.tags.length > 0) ? `
                  <div class="flex flex-wrap gap-1">
                    ${item.tags.map(t => `<span class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-md font-bold">#${t}</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            </div>

            ${item.url ? `
              <div class="p-4 pt-0">
                <a href="${item.url}" target="_blank" class="w-full py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-xs font-bold rounded-xl flex items-center justify-center gap-1 transition">
                  🔗 원본 보기 ↗
                </a>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
