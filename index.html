<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>레퍼런스 모음집</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .masonry-grid { column-count: 2; column-gap: 14px; }
    @media (min-width: 640px) { .masonry-grid { column-count: 3; column-gap: 18px; } }
    .masonry-item { break-inside: avoid; margin-bottom: 14px; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-24 transition-colors duration-300">

  <!-- 헤더 -->
  <header class="sticky top-0 z-40 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md border-b border-slate-200/60 dark:border-slate-800/60 px-4 py-3.5">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">✨</span>
        <h1 class="text-lg font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">
          레퍼런스 창고
        </h1>
      </div>
      <div class="flex gap-2 items-center">
        <button onclick="openModal()" class="flex items-center gap-1.5 px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-full text-xs font-semibold shadow-md shadow-indigo-500/25 transition-all duration-200">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          추가
        </button>
        <button id="themeToggle" onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
          🌙
        </button>
      </div>
    </div>
    
    <!-- 태그 필터 스크롤바 -->
    <div class="max-w-md mx-auto mt-3 flex gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs" id="tagFilters"></div>
  </header>

  <!-- 메인 그리드 영역 -->
  <main class="max-w-md mx-auto p-3.5">
    <div id="cardGrid" class="masonry-grid"></div>
  </main>

  <!-- 등록 모달 팝업 -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all duration-300">
    <div class="bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl w-full max-w-md p-6 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl border border-slate-100 dark:border-slate-800">
      
      <div class="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
        <h2 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <span>📌</span> 레퍼런스 등록
        </h2>
        <button onclick="closeModal()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl font-bold">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">제목</label>
          <input type="text" id="inputTitle" placeholder="레퍼런스 제목을 적어주세요" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">출처 / 영상 링크</label>
          <input type="url" id="inputLink" placeholder="https://instagram.com/..." class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">이미지 파일 첨부</label>
          <input type="file" id="inputFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 dark:file:bg-indigo-950 dark:file:text-indigo-400 hover:file:bg-indigo-100 transition">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1.5">태그 선택</label>
          <div id="modalTags" class="flex flex-wrap gap-1.5"></div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">메모 / 아이디어 포인트</label>
          <textarea id="inputMemo" rows="3" placeholder="어떤 부분이 참고가 되었나요?" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition resize-none"></textarea>
        </div>
      </div>

      <button onclick="saveReference()" id="saveBtn" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-500/25 active:scale-[0.98] transition-all text-xs">
        저장하기
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TAGS = ['전체', '📌핀고정', '맛집', '여행_국내', '여행_해외', '촬영_노하우', '촬영_영상구성레퍼런스', '편집_영상레퍼런스', '편집_썸네일레퍼런스', '편집_꿀팁', '계정_레퍼런스', '계정_마케팅운영팁'];
    const ALL_TAGS = TAGS.filter(t => t !== '전체' && t !== '📌핀고정');
    let selectedTags = new Set(['전체']);
    let modalSelectedTags = new Set();

    function renderTagFilters() {
      const container = document.getElementById('tagFilters');
      container.innerHTML = TAGS.map(tag => `
        <button onclick="toggleTag('${tag}')" class="px-3 py-1.5 rounded-full whitespace-nowrap transition-all duration-200 ${selectedTags.has(tag) ? 'bg-indigo-600 text-white font-semibold shadow-sm shadow-indigo-500/30' : 'bg-slate-200/70 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-300/70'}">
          ${tag}
        </button>
      `).join('');
    }

    function toggleTag(tag) {
      if (tag === '전체') {
        selectedTags.clear();
        selectedTags.add('전체');
      } else {
        selectedTags.delete('전체');
        if (selectedTags.has(tag)) selectedTags.delete(tag);
        else selectedTags.add(tag);
        if (selectedTags.size === 0) selectedTags.add('전체');
      }
      renderTagFilters();
      loadData();
    }

    function openModal() {
      document.getElementById('addModal').classList.remove('hidden');
      renderModalTags();
    }

    function closeModal() {
      document.getElementById('addModal').classList.add('hidden');
      modalSelectedTags.clear();
    }

    function renderModalTags() {
      const container = document.getElementById('modalTags');
      container.innerHTML = ALL_TAGS.map(tag => `
        <button onclick="toggleModalTag('${tag}')" type="button" class="px-2.5 py-1 rounded-lg text-xs transition-all ${modalSelectedTags.has(tag) ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200'}">
          #${tag}
        </button>
      `).join('');
    }

    function toggleModalTag(tag) {
      if (modalSelectedTags.has(tag)) modalSelectedTags.delete(tag);
      else modalSelectedTags.add(tag);
      renderModalTags();
    }

    async function saveReference() {
      const title = document.getElementById('inputTitle').value;
      const link_url = document.getElementById('inputLink').value;
      const memo = document.getElementById('inputMemo').value;
      const fileInput = document.getElementById('inputFile');
      const saveBtn = document.getElementById('saveBtn');
      
      saveBtn.innerText = "업로드 중...";
      saveBtn.disabled = true;

      let image_url = null;
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('reference-images').upload(fileName, file);
        if (!uploadError) {
          const { data: urlData } = supabaseClient.storage.from('reference-images').getPublicUrl(fileName);
          image_url = urlData.publicUrl;
        }
      }

      const { error } = await supabaseClient.from('references').insert([{
        title, link_url, memo, image_url, tags: Array.from(modalSelectedTags)
      }]);

      saveBtn.innerText = "저장하기";
      saveBtn.disabled = false;

      if (!error) {
        closeModal();
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputLink').value = '';
        document.getElementById('inputMemo').value = '';
        document.getElementById('inputFile').value = '';
        loadData();
      } else {
        alert('저장 실패: ' + error.message);
      }
    }

    async function loadData() {
      let query = supabaseClient.from('references').select('*').order('is_pinned', { ascending: false }).order('created_at', { ascending: false });
      const { data, error } = await query;
      if (error) return console.error(error);

      let filteredData = data || [];
      if (!selectedTags.has('전체')) {
        filteredData = filteredData.filter(item => {
          if (selectedTags.has('📌핀고정') && item.is_pinned) return true;
          return Array.from(selectedTags).some(t => item.tags && item.tags.includes(t));
        });
      }

      const grid = document.getElementById('cardGrid');
      if (filteredData.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center py-20 text-center">
            <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-2xl mb-3">🎨</div>
            <p class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">저장된 레퍼런스가 없습니다</p>
            <p class="text-xs text-slate-400">우측 상단 '+ 추가' 버튼을 눌러 소중한 아이디어를 기록해보세요.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filteredData.map(item => `
        <div class="masonry-item bg-white dark:bg-slate-900 rounded-2xl overflow-hidden shadow-sm hover:shadow-md border border-slate-200/60 dark:border-slate-800 transition-all duration-200 relative group">
          <button onclick="togglePin('${item.id}', ${item.is_pinned})" class="absolute top-2.5 right-2.5 z-10 bg-black/30 hover:bg-black/50 text-white rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-md transition-all active:scale-90">
            ${item.is_pinned ? '📌' : '📍'}
          </button>
          
          ${item.image_url ? `<div class="overflow-hidden"><img src="${item.image_url}" class="w-full object-cover group-hover:scale-105 transition duration-300" loading="lazy"/></div>` : ''}
          
          <div class="p-3.5">
            ${item.title ? `<h3 class="font-bold text-sm text-slate-900 dark:text-white leading-snug mb-1.5">${item.title}</h3>` : ''}
            ${item.memo ? `<p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed mb-2.5 whitespace-pre-line">${item.memo}</p>` : ''}
            
            ${item.tags && item.tags.length > 0 ? `
              <div class="flex flex-wrap gap-1 mb-3">
                ${item.tags.map(t => `<span class="text-[10px] font-medium bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded-md">#${t}</span>`).join('')}
              </div>
            ` : ''}

            ${item.link_url ? `
              <a href="${item.link_url}" target="_blank" class="flex items-center justify-center gap-1 w-full text-center text-xs bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 py-2 rounded-xl font-semibold transition">
                <span>링크 바로가기</span>
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
              </a>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    async function togglePin(id, current) {
      await supabaseClient.from('references').update({ is_pinned: !current }).eq('id', id);
      loadData();
    }

    renderTagFilters();
    loadData();
  </script>
</body>
</html>
