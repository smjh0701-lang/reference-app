<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>프롬프트 & 템플릿 보관함</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jelly: {
              pink: '#FAA4B5',
              fawn: '#F8B77C',
              maize: '#FFF183',
              'maize-light': '#FFFDE8',
              sky: '#70C1E1',
              olivine: '#82BA88',
              dark: '#2A2438'
            }
          },
          boxShadow: {
            'game': '3px 3px 0px 0px rgba(42, 36, 56, 1)',
            'game-lg': '4px 4px 0px 0px rgba(42, 36, 56, 1)',
            'game-btn': '0px 4px 0px 0px rgba(42, 36, 56, 1)',
            'game-btn-active': '0px 0px 0px 0px rgba(42, 36, 56, 1)'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-jelly-maize-light text-jelly-dark min-h-screen pb-28">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-40 bg-jelly-maize-light/95 backdrop-blur-md border-b-2 border-jelly-dark px-4 sm:px-8 py-3.5 shadow-sm">
    <div class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-jelly-pink border-2 border-jelly-dark shadow-game flex items-center justify-center text-xl animate-bounce">
          🍬
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-black tracking-tight text-jelly-dark flex items-center gap-1">
            프롬프트 보관소
            <span class="text-xs bg-jelly-sky px-2 py-0.5 rounded-full border border-jelly-dark text-white shadow-sm font-extrabold">LV.99</span>
          </h1>
          <p class="text-[11px] text-jelly-dark/70 font-extrabold leading-none">원클릭 젤리 템플릿 아카이브</p>
        </div>
      </div>
      <button onclick="openModal()" class="flex items-center gap-1.5 px-4 py-2.5 bg-jelly-fawn hover:opacity-95 active:translate-y-1 active:shadow-none text-jelly-dark rounded-2xl text-xs font-black border-2 border-jelly-dark shadow-game transition-all">
        <span>➕</span> 새 퀘스트 등록
      </button>
    </div>

    <!-- 검색창 및 카테고리 필터 -->
    <div class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto mt-3.5 space-y-2.5">
      <div class="relative">
        <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍 검색할 프롬프트, 태그를 입력하세요..." class="w-full px-4 py-3 rounded-2xl bg-white text-xs font-bold focus:outline-none border-2 border-jelly-dark text-jelly-dark placeholder-jelly-dark/40 shadow-game">
      </div>
      <div id="categoryFilterList" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1"></div>
    </div>
  </header>

  <!-- 메인 프롬프트 그리드 -->
  <main class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto p-4 sm:p-6">
    <div id="promptList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- 복사 완료 토스트 알림 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-jelly-olivine text-white px-6 py-3 rounded-2xl shadow-game-lg border-2 border-jelly-dark flex items-center gap-2 text-xs font-black transition-all duration-300 transform">
    <span class="text-base">🎉</span>
    <span id="toastMsg">클립보드 획득 성공! (Ctrl+V로 사용)</span>
  </div>

  <!-- 프롬프트 등록 및 수정 모달 -->
  <div id="promptModal" class="fixed inset-0 bg-jelly-dark/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md sm:max-w-lg p-6 space-y-4 max-h-[88vh] overflow-y-auto border-4 border-jelly-dark shadow-game-lg">
      <div class="flex justify-between items-center pb-2 border-b-2 border-jelly-dark">
        <h2 id="modalTitle" class="text-base font-black text-jelly-dark flex items-center gap-2">
          <span>📜</span> 프롬프트 퀘스트 작성
        </h2>
        <button onclick="closeModal()" class="w-8 h-8 rounded-xl bg-jelly-pink border-2 border-jelly-dark text-jelly-dark font-black flex items-center justify-center shadow-game hover:bg-rose-400">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-black mb-1 text-jelly-dark">프롬프트 제목</label>
          <input type="text" id="inputTitle" placeholder="예: 자소서 인사팀 기피 말버릇 교정" class="w-full px-3.5 py-2.5 bg-jelly-maize-light border-2 border-jelly-dark rounded-xl focus:outline-none font-bold text-jelly-dark">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-black mb-1 text-jelly-dark">카테고리</label>
            <select id="inputCategory" class="w-full px-3.5 py-2.5 bg-jelly-maize-light border-2 border-jelly-dark rounded-xl focus:outline-none font-bold text-jelly-dark">
              <option value="자소서/취업">📝 자소서/취업</option>
              <option value="SNS/콘텐츠">📸 SNS/콘텐츠</option>
              <option value="블로그/원고">✍️ 블로그/원고</option>
              <option value="업무/생산성">💼 업무/생산성</option>
              <option value="기타">💡 기타</option>
            </select>
          </div>
          <div>
            <label class="block font-black mb-1 text-jelly-dark">한줄 설명</label>
            <input type="text" id="inputDesc" placeholder="예: 대기업 인사팀 필수 체크리스트" class="w-full px-3.5 py-2.5 bg-jelly-maize-light border-2 border-jelly-dark rounded-xl focus:outline-none font-bold text-jelly-dark">
          </div>
        </div>

        <div>
          <label class="block font-black mb-1 text-jelly-dark">프롬프트 본문 ([대괄호] 변수 지원)</label>
          <textarea id="inputContent" rows="6" placeholder="프롬프트 본문을 입력하세요. 변수는 [키워드], [내용] 형식으로 적어두면 강조 표시됩니다." class="w-full px-3.5 py-2.5 bg-jelly-maize-light border-2 border-jelly-dark rounded-xl focus:outline-none resize-none font-mono text-[11px] font-bold text-jelly-dark"></textarea>
        </div>

        <div>
          <label class="block font-black mb-1 text-jelly-dark">태그 (쉼표로 구분)</label>
          <input type="text" id="inputTags" placeholder="예: 자소서, 퇴고, 대기업, 필수역량" class="w-full px-3.5 py-2.5 bg-jelly-maize-light border-2 border-jelly-dark rounded-xl focus:outline-none font-bold text-jelly-dark">
        </div>
      </div>

      <button onclick="savePrompt()" id="saveBtn" class="w-full py-3.5 bg-jelly-pink hover:opacity-95 active:translate-y-1 text-jelly-dark font-black rounded-2xl text-xs border-2 border-jelly-dark shadow-game transition">
        저장하기
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CATEGORIES = ['전체', '자소서/취업', 'SNS/콘텐츠', '블로그/원고', '업무/생산성', '기타'];
    let selectedCategory = '전체';
    let cachedPrompts = [];
    let editingId = null;

    const PRESET_PROMPTS = [
      {
        title: "대기업 인사팀 기피 말버릇 필터링 교정",
        category: "자소서/취업",
        description: "추상적 부사와 반복 말버릇을 행동 및 정량 중심으로 변환",
        content: `다음 자기소개서 초안을 아래 3가지 원칙에 맞춰 교정해줘.
1. '~한 경험이 있습니다' 반복 표현을 삭제하고, 행동 중심 문장으로 변환
2. '배웠습니다 / 느꼈습니다' 식의 단순 종결을 피하고, 배움 이후 실제 행동 변화로 연결
3. '항상 / 언제나 / 꾸준히' 같은 포괄적 부사를 정량 기반 사실 강조로 대체

[초안 내용 붙여넣기]`,
        tags: ["자소서", "문체교정", "대기업", "행동중심"]
      },
      {
        title: "AI 티 제거 & 자연스러운 대체 연결어 교정",
        category: "자소서/취업",
        description: "AI 특유의 정리형 부사를 제거하고 자연스러운 연결어로 치환",
        content: `다음 글에서 '구조적 접근', '실질적 성과', '업무 맥락', '단순히 ㅇㅇ보다는 ~', '업무 흐름' 같은 AI 특유의 상투적 표현을 제거해줘.
- 가운데점(·)과 따옴표 남발 금지
- '결국', '즉', '따라서', '다시 말해' 같은 요약형 부사 배제
- 대체 연결어 적용: '따라서' ➔ '그 결과/그래서', '이를 통해' ➔ '그 경험으로/그 덕분에', '결과적으로' ➔ '마침내/끝내'

[초안 내용 붙여넣기]`,
        tags: ["AI티제거", "퇴고", "문장다듬기", "대체어"]
      },
      {
        title: "채용공고 맞춤 역량 분석 & 자소서 설계",
        category: "자소서/취업",
        description: "공고 필수 역량과 내 프로젝트 경험을 매칭하는 전략 도출",
        content: `이 채용공고를 분석해서 인사담당자가 원하는 인재상과 핵심 키워드를 도출해줘.

[채용공고 붙여넣기]

도출된 필수 역량을 바탕으로, 내 경험 [경력/학력/프로젝트 내용]을 어떤 관점에서 어필해야 가장 설득력 있는 자기소개서가 될지 작성 전략을 세워줘.`,
        tags: ["공고분석", "인재상", "프로젝트매칭"]
      },
      {
        title: "기업 지원동기 진정성 & 비전 연결",
        category: "자소서/취업",
        description: "단순 회사 칭찬을 배제하고 최근 이슈와 나의 목표 연결",
        content: `단순히 '좋은 회사라서'가 아닌, 이 회사에서 일하고 싶다는 진정성을 담은 지원동기를 작성해줘.

- 회사 정보/최근 이슈/비전: [회사 정보 입력]
- 나의 직무 목표 및 강점: [내 강점 입력]

위 내용을 결합하여 설득력 있고 자연스럽게 연결된 지원동기를 작성해줘.`,
        tags: ["지원동기", "기업분석", "비전"]
      },
      {
        title: "인스타 릴스 3초 후킹 & 대본 구성안",
        category: "SNS/콘텐츠",
        description: "조회수 최적화 15~30초 숏폼 릴스 대본 템플릿",
        content: `주제: [주제 및 키워드]
타겟: [시청자 타겟층]

위 내용으로 15초~30초 분량의 릴스 대본을 작성해줘.
1. 초반 3초 시선 집중 후킹 멘트 및 화면 연출 구도
2. 본문 핵심 꿀팁/정보 3가지 요약
3. 저장 및 공유를 유도하는 마무리 CTA 멘트`,
        tags: ["릴스", "인스타", "대본", "숏폼"]
      }
    ];

    function renderCategoryFilters() {
      const container = document.getElementById('categoryFilterList');
      container.innerHTML = CATEGORIES.map(cat => `
        <button onclick="filterByCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap transition border-2 border-jelly-dark ${selectedCategory === cat ? 'bg-jelly-sky text-white shadow-game' : 'bg-white text-jelly-dark hover:bg-jelly-maize'}">
          ${cat}
        </button>
      `).join('');
    }

    function filterByCategory(cat) {
      selectedCategory = cat;
      renderCategoryFilters();
      renderList();
    }

    async function loadData() {
      const { data } = await supabaseClient.from('prompts').select('*');
      
      if (!data || data.length === 0) {
        await supabaseClient.from('prompts').insert(PRESET_PROMPTS);
        const { data: refetched } = await supabaseClient.from('prompts').select('*');
        cachedPrompts = (refetched || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      } else {
        cachedPrompts = data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }

      renderCategoryFilters();
      renderList();
    }

    function openModal(item = null) {
      if (item) {
        editingId = item.id;
        document.getElementById('modalTitle').innerHTML = '<span>✏️</span> 퀘스트 수정하기';
        document.getElementById('saveBtn').innerText = '수정 완료';
        document.getElementById('inputTitle').value = item.title || '';
        document.getElementById('inputCategory').value = item.category || '기타';
        document.getElementById('inputDesc').value = item.description || '';
        document.getElementById('inputContent').value = item.content || '';
        document.getElementById('inputTags').value = (item.tags || []).join(', ');
      } else {
        editingId = null;
        document.getElementById('modalTitle').innerHTML = '<span>📜</span> 프롬프트 퀘스트 작성';
        document.getElementById('saveBtn').innerText = '저장하기';
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputCategory').value = '자소서/취업';
        document.getElementById('inputDesc').value = '';
        document.getElementById('inputContent').value = '';
        document.getElementById('inputTags').value = '';
      }
      document.getElementById('promptModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('promptModal').classList.add('hidden');
      editingId = null;
    }

    async function savePrompt() {
      const title = document.getElementById('inputTitle').value;
      const category = document.getElementById('inputCategory').value;
      const description = document.getElementById('inputDesc').value;
      const content = document.getElementById('inputContent').value;
      const tagsRaw = document.getElementById('inputTags').value;

      if (!title || !content) return alert('제목과 본문은 필수 입력 사항입니다.');

      const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);
      const payload = { title, category, description, content, tags };

      if (editingId) {
        await supabaseClient.from('prompts').update(payload).eq('id', editingId);
      } else {
        await supabaseClient.from('prompts').insert([payload]);
      }

      closeModal();
      loadData();
    }

    async function deleteItem(id, event) {
      if (event) event.stopPropagation();
      if (!confirm('이 퀘스트를 삭제할까요?')) return;
      await supabaseClient.from('prompts').delete().eq('id', id);
      loadData();
    }

    function copyToClipboard(text, btnElement, event) {
      if (event) event.stopPropagation();
      const originalHtml = btnElement.innerHTML;
      
      navigator.clipboard.writeText(text).then(() => {
        btnElement.innerHTML = '<span>⚡</span> 복사 완료!';
        btnElement.classList.replace('bg-jelly-pink', 'bg-jelly-olivine');
        btnElement.classList.replace('text-jelly-dark', 'text-white');
        showToast('클립보드 획득 성공! 바로 Ctrl+V 하세요 ✨');

        setTimeout(() => {
          btnElement.innerHTML = originalHtml;
          btnElement.classList.replace('bg-jelly-olivine', 'bg-jelly-pink');
          btnElement.classList.replace('text-white', 'text-jelly-dark');
        }, 1500);
      }).catch(() => {
        const t = document.createElement("textarea");
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        document.body.removeChild(t);
        showToast('클립보드 획득 완료! ✨');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2000);
    }

    function getCategoryColor(cat) {
      switch(cat) {
        case '자소서/취업': return 'bg-jelly-sky text-white';
        case 'SNS/콘텐츠': return 'bg-jelly-pink text-jelly-dark';
        case '블로그/원고': return 'bg-jelly-olivine text-white';
        case '업무/생산성': return 'bg-jelly-fawn text-jelly-dark';
        default: return 'bg-jelly-maize text-jelly-dark';
      }
    }

    function highlightVariables(text) {
      return text.replace(/\[([^\]]+)\]/g, '<span class="text-jelly-dark bg-jelly-maize font-black px-1.5 py-0.5 rounded-lg border border-jelly-dark shadow-sm">[$1]</span>');
    }

    function renderList() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('promptList');

      const filtered = cachedPrompts.filter(item => {
        const matchesCategory = selectedCategory === '전체' || item.category === selectedCategory;
        const matchesSearch = (item.title || '').toLowerCase().includes(search) ||
                              (item.description || '').toLowerCase().includes(search) ||
                              (item.content || '').toLowerCase().includes(search) ||
                              (item.tags || []).some(t => t.toLowerCase().includes(search));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-20 text-xs text-jelly-dark/50 font-black">일치하는 프롬프트 퀘스트가 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const jsonStr = JSON.stringify(item).replace(/'/g, "&apos;");
        const safeContent = (item.content || '').replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, "\\n");

        return `
          <div class="bg-white border-2 border-jelly-dark rounded-3xl p-5 shadow-game hover:shadow-game-lg hover:-translate-y-1 transition-all duration-200 flex flex-col justify-between space-y-4">
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-black px-3 py-1 rounded-full border-2 border-jelly-dark ${getCategoryColor(item.category)}">
                  ${item.category || '기타'}
                </span>
                <div class="flex items-center gap-1.5">
                  <button onclick='openModal(${jsonStr})' class="w-7 h-7 rounded-xl bg-jelly-maize border border-jelly-dark hover:bg-yellow-300 text-xs font-black transition flex items-center justify-center shadow-sm">✏️</button>
                  <button onclick="deleteItem(${item.id}, event)" class="w-7 h-7 rounded-xl bg-rose-200 border border-jelly-dark hover:bg-rose-400 text-xs font-black transition flex items-center justify-center shadow-sm">&times;</button>
                </div>
              </div>

              <div>
                <h3 class="font-black text-base text-jelly-dark leading-snug">${item.title}</h3>
                ${item.description ? `<p class="text-xs text-jelly-dark/70 mt-1 font-bold">${item.description}</p>` : ''}
              </div>

              <div class="p-3.5 bg-jelly-maize-light rounded-2xl border-2 border-jelly-dark text-xs text-jelly-dark whitespace-pre-line leading-relaxed max-h-48 overflow-y-auto no-scrollbar font-mono text-[11px] font-semibold">
                ${highlightVariables(item.content)}
              </div>

              ${(item.tags && item.tags.length > 0) ? `
                <div class="flex flex-wrap gap-1.5 pt-1">
                  ${item.tags.map(t => `<span class="text-[10px] text-jelly-dark bg-jelly-fawn/40 px-2 py-0.5 rounded-lg font-black border border-jelly-dark/30">#${t}</span>`).join('')}
                </div>
              ` : ''}
            </div>

            <button onclick="copyToClipboard('${safeContent}', this, event)" class="w-full py-3 bg-jelly-pink hover:opacity-95 active:translate-y-1 active:shadow-none text-jelly-dark font-black rounded-2xl text-xs flex items-center justify-center gap-1.5 border-2 border-jelly-dark shadow-game transition-all">
              <span>📋</span> 프롬프트 원클릭 복사
            </button>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
