<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>레퍼런스 모음집</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .masonry-grid { column-count: 2; column-gap: 14px; }
    @media (min-width: 640px) { .masonry-grid { column-count: 3; column-gap: 18px; } }
    .masonry-item { break-inside: avoid; margin-bottom: 14px; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-28 transition-colors duration-300">

  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/60 dark:border-slate-800/60 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">✨</span>
        <h1 class="text-lg font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">
          레퍼런스 창고
        </h1>
      </div>
      <div class="flex gap-2 items-center">
        <button id="selectModeBtn" onclick="toggleSelectMode()" class="px-3 py-1.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-full text-xs font-semibold transition">
          선택 삭제
        </button>
        <button onclick="openModal()" class="flex items-center gap-1.5 px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-full text-xs font-semibold shadow-md shadow-indigo-500/25 transition-all duration-200">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          추가
        </button>
        <button id="themeToggle" onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
          🌙
        </button>
      </div>
    </div>
    
    <div class="max-w-md mx-auto mt-2.5 flex items-center justify-between gap-2">
      <button onclick="toggleFilterDrawer()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 transition">
        <span>🏷️ 카테고리 선택</span>
        <span id="filterBadge" class="bg-indigo-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">전체</span>
        <svg id="arrowIcon" class="w-3.5 h-3.5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>

      <div id="selectedChips" class="flex gap-1 overflow-x-auto no-scrollbar text-[11px]"></div>
    </div>

    <div id="filterDrawer" class="max-w-md mx-auto mt-2.5 hidden bg-slate-100/90 dark:bg-slate-800/90 p-3 rounded-2xl border border-slate-200/60 dark:border-slate-700/60 backdrop-blur">
      <div class="text-[11px] font-bold text-slate-400 mb-2 flex justify-between items-center">
        <span>한 눈에 보는 카테고리 (복수 선택 가능)</span>
        <button onclick="resetTags()" class="text-indigo-500 hover:underline">초기화</button>
      </div>
      <div id="tagFiltersGrid" class="flex flex-wrap gap-1.5"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-3.5">
    <div id="cardGrid" class="masonry-grid"></div>
  </main>

  <div id="deleteBar" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-rose-600 text-white px-5 py-3 rounded-2xl shadow-xl border border-rose-500 flex items-center gap-4 text-xs font-bold transition-all">
    <span id="selectedCount">0개 선택됨</span>
    <button onclick="deleteSelected()" class="bg-white text-rose-600 px-3 py-1.5 rounded-xl hover:bg-rose-50 active:scale-95 transition">
      선택 항목 삭제
    </button>
  </div>

  <div id="addModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all duration-300">
    <div class="bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl w-full max-w-md p-6 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl border border-slate-100 dark:border-slate-800">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
        <h2 id="modalTitle" class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <span>🖼️</span> 레퍼런스 등록
        </h2>
        <button onclick="closeModal()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl font-bold">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">제목 / 계정명</label>
          <input type="text" id="inputTitle" placeholder="예: 추구미 계정, 릴스 구성 참고" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">인스타 / 유튜브 / 웹 링크</label>
          <input type="url" id="inputLink" placeholder="https://instagram.com/..." class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition">
        </div>
        
        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">📸 이미지 첨부 (PC에서는 Ctrl+V 가능)</label>
          <div id="pasteDropArea" class="border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl p-3 text-center bg-slate-50 dark:bg-slate-800/40 hover:bg-slate-100 transition">
            <input type="file" id="inputFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 dark:file:bg-indigo-950 dark:file:text-indigo-400">
            <p class="text-[11px] text-indigo-500 font-medium mt-1">💡 캡처 후 이 팝업창에서 바로 <kbd class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-700 rounded text-[10px]">Ctrl</kbd> + <kbd class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-700 rounded text-[10px]">V</kbd> 하셔도 됩니다!</p>
            <div id="pastePreview" class="mt-2 hidden">
              <img id="previewImg" src="" class="max-h-32 mx-auto rounded-lg border shadow-sm">
              <span class="text-[10px] text-green-600 dark:text-green-400 font-bold block mt-1">✓ 이미지가 선택/붙여넣어졌습니다!</span>
            </div>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1.5">태그 선택</label>
          <div id="modalTags" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">메모 / 참고할 특징</label>
          <textarea id="inputMemo" rows="2" placeholder="어떤 부분이 참고가 되었나요?" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition resize-none"></textarea>
        </div>
      </div>

      <button onclick="saveReference()" id="saveBtn" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-500/25 active:scale-[0.98] transition-all text-xs">
        저장하기
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TAGS = ['전체', '📌핀고정', '맛집', '여행_국내', '여행_해외', '촬영_노하우', '촬영_영상구성레퍼런스', '편집_영상레퍼런스', '편집_썸네일레퍼런스', '편집_꿀팁', '계정_레퍼런스', '계정_마케팅운영팁'];
    const ALL_TAGS = TAGS.filter(t => t !== '전체' && t !== '📌핀고정');
    let selectedTags = new Set(['전체']);
    let modalSelectedTags = new Set();
    let pastedFile = null;
    let editingId = null;
    let existingImageUrl = null;
    let cachedData = [];
    let isSelectMode = false;
    let selectedIds = new Set();

    document.addEventListener('paste', function(e) {
      const modal = document.getElementById('addModal');
      if (modal.classList.contains('hidden')) return;

      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') === 0) {
          const blob = item.getAsFile();
          pastedFile = blob;
          
          const reader = new FileReader();
          reader.onload = function(event) {
            document.getElementById('previewImg').src = event.target.result;
            document.getElementById('pastePreview').classList.remove('hidden');
          };
          reader.readAsDataURL(blob);
          break;
        }
      }
    });

    function toggleSelectMode() {
      isSelectMode = !isSelectMode;
      selectedIds.clear();
      const btn = document.getElementById('selectModeBtn');
      const deleteBar = document.getElementById('deleteBar');

      if (isSelectMode) {
        btn.innerText = '취소';
        btn.className = 'px-3 py-1.5 bg-rose-100 text-rose-600 dark:bg-rose-950 dark:text-rose-300 rounded-full text-xs font-semibold transition';
        deleteBar.classList.remove('hidden');
        updateSelectedCount();
      } else {
        btn.innerText = '선택 삭제';
        btn.className = 'px-3 py-1.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-full text-xs font-semibold transition';
        deleteBar.classList.add('hidden');
      }
      renderCards();
    }

    function toggleSelectItem(id) {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      updateSelectedCount();
      renderCards();
    }

    function updateSelectedCount() {
      document.getElementById('selectedCount').innerText = `${selectedIds.size}개 선택됨`;
    }

    async function deleteSelected() {
      if (selectedIds.size === 0) return alert('삭제할 항목을 선택해주세요.');
      if (!confirm(`선택한 ${selectedIds.size}개 레퍼런스를 삭제할까요?`)) return;

      const { error } = await supabaseClient.from('references').delete().in('id', Array.from(selectedIds));
      if (!error) {
        toggleSelectMode();
        loadData();
      } else {
        alert('삭제 실패: ' + error.message);
      }
    }

    function toggleFilterDrawer() {
      const drawer = document.getElementById('filterDrawer');
      const arrow = document.getElementById('arrowIcon');
      drawer.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    }

    function renderTagFilters() {
      const container = document.getElementById('tagFiltersGrid');
      const badge = document.getElementById('filterBadge');
      const chips = document.getElementById('selectedChips');

      badge.innerText = selectedTags.has('전체') ? '전체' : `${selectedTags.size}개`;

      container.innerHTML = TAGS.map(tag => `
        <button onclick="toggleTag('${tag}')" class="px-2.5 py-1.5 rounded-xl text-xs font-medium transition-all duration-150 ${selectedTags.has(tag) ? 'bg-indigo-600 text-white font-semibold shadow-sm' : 'bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">
          ${tag}
        </button>
      `).join('');

      chips.innerHTML = Array.from(selectedTags).map(t => `
        <span class="bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 px-2 py-0.5 rounded-lg whitespace-nowrap font-medium">#${t}</span>
      `).join('');
    }

    function resetTags() {
      selectedTags.clear();
      selectedTags.add('전체');
      renderTagFilters();
      loadData();
    }

    function toggleTag(tag) {
      if (tag === '전체') {
        selectedTags.clear();
        selectedTags.add('전체');
      } else {
        selectedTags.delete('전체');
        if (selectedTags.has(tag)) selectedTags.delete(tag);
        else selectedTags.add(tag);
        if (selectedTags.size === 0) selectedTags.add('전체');
      }
      renderTagFilters();
      loadData();
    }

    function openModal() {
      editingId = null;
      existingImageUrl = null;
      document.getElementById('modalTitle').innerHTML = '<span>🖼️</span> 레퍼런스 등록';
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputLink').value = '';
      document.getElementById('inputMemo').value = '';
      document.getElementById('inputFile').value = '';
      document.getElementById('pastePreview').classList.add('hidden');
      modalSelectedTags.clear();
      pastedFile = null;
      document.getElementById('addModal').classList.remove('hidden');
      renderModalTags();
    }

    function editReference(id) {
      if (isSelectMode) return toggleSelectItem(id);

      const item = cachedData.find(i => i.id === id);
      if (!item) return;

      editingId = id;
      existingImageUrl = item.image_url;

      document.getElementById('modalTitle').innerHTML = '<span>✏️</span> 레퍼런스 수정';
      document.getElementById('inputTitle').value = item.title || '';
      document.getElementById('inputLink').value = item.link_url || '';
      document.getElementById('inputMemo').value = item.memo || '';
      document.getElementById('inputFile').value = '';

      if (item.image_url) {
        document.getElementById('previewImg').src = item.image_url;
        document.getElementById('pastePreview').classList.remove('hidden');
      } else {
        document.getElementById('pastePreview').classList.add('hidden');
      }

      modalSelectedTags = new Set(item.tags || []);
      pastedFile = null;
      document.getElementById('addModal').classList.remove('hidden');
      renderModalTags();
    }

    function closeModal() {
      document.getElementById('addModal').classList.add('hidden');
      modalSelectedTags.clear();
      pastedFile = null;
      editingId = null;
      existingImageUrl = null;
      document.getElementById
