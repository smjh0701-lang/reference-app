<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>랍땡이의 레퍼런스 창고</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-28">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/60 dark:border-slate-800/60 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">📁</span>
        <h1 class="text-lg font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
          랍땡이의 레퍼런스 창고
        </h1>
      </div>
      <button onclick="openModal()" class="flex items-center gap-1 px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full text-xs font-semibold shadow-md transition">
        + 등록
      </button>
    </div>

    <!-- 검색 및 태그 필터 -->
    <div class="max-w-md mx-auto mt-3 space-y-2">
      <div class="relative">
        <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍 검색어 또는 태그 입력..." class="w-full px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div id="tagFilterList" class="flex gap-1 overflow-x-auto no-scrollbar py-1"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-3.5">
    <div id="referenceList" class="space-y-3"></div>
  </main>

  <!-- 📝 레퍼런스 등록/수정 모달 -->
  <div id="refModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl w-full max-w-md p-6 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b">
        <h2 id="modalTitle" class="text-base font-bold">📁 레퍼런스 등록</h2>
        <button onclick="closeModal()" class="text-xl font-bold text-slate-400">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold mb-1">제목</label>
          <input type="text" id="inputTitle" placeholder="레퍼런스 제목을 입력하세요" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800">
        </div>

        <div>
          <label class="block font-semibold mb-1">원본 URL 링크</label>
          <input type="url" id="inputUrl" placeholder="https://..." class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800">
        </div>

        <div>
          <label class="block font-semibold mb-1">태그 (쉼표로 구분)</label>
          <div id="modalTagPresetList" class="flex flex-wrap gap-1 mb-2"></div>
          <input type="text" id="inputTags" placeholder="예: 릴스, 캡컷, 아이폰" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800">
        </div>

        <div>
          <label class="block font-semibold mb-1">이미지 캡처/첨부 (Ctrl+V 붙여넣기)</label>
          <div id="imageDropArea" class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-4 text-center cursor-pointer bg-slate-50 dark:bg-slate-800/50" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event)">
            <p class="text-slate-500">클릭해서 이미지를 첨부하거나<br><span class="text-indigo-600 font-bold">Ctrl+V</span>로 붙여넣으세요.</p>
          </div>
          <div id="previewList" class="flex flex-wrap gap-2 mt-2"></div>
        </div>

        <div>
          <label class="block font-semibold mb-1">인사이트 메모</label>
          <textarea id="inputMemo" rows="3" placeholder="메모할 내용을 적어주세요." class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800 resize-none"></textarea>
        </div>
      </div>

      <button onclick="saveReference()" id="saveBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-lg">
        저장하기
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let referenceList = [];
    let selectedTag = 'ALL';
    let editingId = null;
    let imageList = [];
    let selectedModalTags = new Set();

    window.addEventListener('paste', function(e) {
      const modal = document.getElementById('refModal');
      if (modal.classList.contains('hidden')) return;

      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          readAndAddImage(blob);
        }
      }
    });

    function handleFileSelect(e) {
      const files = e.target.files;
      if (files) {
        Array.from(files).forEach(file => readAndAddImage(file));
      }
    }

    function readAndAddImage(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imageList.push(e.target.result);
        renderImagePreviews();
      };
      reader.readAsDataURL(file);
    }

    function removeImage(index) {
      imageList.splice(index, 1);
      renderImagePreviews();
    }

    function renderImagePreviews() {
      const container = document.getElementById('previewList');
      if (imageList.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = imageList.map((img, idx) => `
        <div class="relative w-14 h-14 rounded-lg border overflow-hidden">
          <img src="${img}" class="w-full h-full object-cover">
          <button type="button" onclick="removeImage(${idx})" class="absolute top-0 right-0 bg-rose-500 text-white w-4 h-4 text-[10px] font-bold">&times;</button>
        </div>
      `).join('');
    }

    function renderModalTagPresets() {
      const tagSet = new Set();
      referenceList.forEach(item => {
        (item.tags || []).forEach(t => tagSet.add(t));
      });

      const container = document.getElementById('modalTagPresetList');
      container.innerHTML = Array.from(tagSet).map(tag => {
        const isSelected = selectedModalTags.has(tag);
        return `
          <button type="button" onclick="toggleModalTag('${tag}')" class="px-2 py-0.5 rounded text-[10px] font-bold border ${isSelected ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-300'}">
            #${tag}
          </button>
        `;
      }).join('');
    }

    function toggleModalTag(tag) {
      if (selectedModalTags.has(tag)) {
        selectedModalTags.delete(tag);
      } else {
        selectedModalTags.add(tag);
      }
      renderModalTagPresets();
    }

    function openModal() {
      editingId = null;
      selectedModalTags.clear();
      document.getElementById('modalTitle').innerText = '📁 레퍼런스 등록';
      document.getElementById('saveBtn').innerText = '저장하기';
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputUrl').value = '';
      document.getElementById('inputTags').value = '';
      document.getElementById('inputMemo').value = '';
      imageList = [];
      renderImagePreviews();
      renderModalTagPresets();
      document.getElementById('refModal').classList.remove('hidden');
    }

    function openEditModal(item) {
      editingId = item.id;
      document.getElementById('modalTitle').innerText = '✏️ 레퍼런스 수정';
      document.getElementById('saveBtn').innerText = '수정 완료';
      document.getElementById('inputTitle').value = item.title || '';
      document.getElementById('inputUrl').value = item.url || '';
      document.getElementById('inputTags').value = '';
      selectedModalTags = new Set(item.tags || []);
      document.getElementById('inputMemo').value = item.memo || '';

      imageList = [];
      if (item.image_urls && item.image_urls.length > 0) {
        imageList = [...item.image_urls];
      } else if (item.image_url) {
        imageList = [item.image_url];
      }
      renderImagePreviews();
      renderModalTagPresets();

      document.getElementById('refModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('refModal').classList.add('hidden');
    }

    async function saveReference() {
      const title = document.getElementById('inputTitle').value;
      const url = document.getElementById('inputUrl').value;
      const tagsRaw = document.getElementById('inputTags').value;
      const memo = document.getElementById('inputMemo').value;

      if (!title) return alert('제목을 입력해주세요.');

      const manualTags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);
      const finalTags = Array.from(new Set([...Array.from(selectedModalTags), ...manualTags]));

      const payload = { 
        title, 
        url, 
        tags: finalTags, 
        image_urls: imageList, 
        image_url: imageList[0] || null,
        memo 
      };

      if (editingId) {
        await supabaseClient.from('references').update(payload).eq('id', editingId);
      } else {
        await supabaseClient.from('references').insert([payload]);
      }

      closeModal();
      loadData();
    }

    async function deleteItem(id, event) {
      if (event) event.stopPropagation();
      if (!confirm('삭제하시겠습니까?')) return;
      await supabaseClient.from('references').delete().eq('id', id);
      loadData();
    }

    async function loadData() {
      const { data } = await supabaseClient.from('references').select('*');
      referenceList = (data || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      renderTagFilters();
      renderList();
    }

    function renderTagFilters() {
      const tagSet = new Set();
      referenceList.forEach(item => {
        (item.tags || []).forEach(t => tagSet.add(t));
      });

      const container = document.getElementById('tagFilterList');
      const tags = Array.from(tagSet);

      let html = `
        <button onclick="filterByTag('ALL')" class="px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap transition ${selectedTag === 'ALL' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}">
          전체
        </button>
      `;

      tags.forEach(t => {
        html += `
          <button onclick="filterByTag('${t}')" class="px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap transition ${selectedTag === t ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}">
            #${t}
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function filterByTag(tag) {
      selectedTag = tag;
      renderTagFilters();
      renderList();
    }

    function renderList() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('referenceList');

      const filtered = referenceList.filter(item => {
        const matchesTag = selectedTag === 'ALL' || (item.tags || []).includes(selectedTag);
        const matchesSearch = (item.title || '').toLowerCase().includes(search) || 
                              (item.memo || '').toLowerCase().includes(search) || 
                              (item.tags || []).some(t => t.toLowerCase().includes(search));
        return matchesTag && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center py-10 text-xs text-slate-400">저장된 데이터가 없습니다.</p>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const imgs = (item.image_urls && item.image_urls.length > 0) ? item.image_urls : (item.image_url ? [item.image_url] : []);
        const jsonStr = JSON.stringify(item).replace(/'/g, "&apos;");

        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm space-y-2 p-3.5 relative">
            <div class="flex items-start justify-between gap-2">
              <h3 class="font-bold text-sm text-slate-900 dark:text-white leading-snug">${item.title}</h3>
              <div class="flex items-center gap-1">
                <button onclick='openEditModal(${jsonStr})' class="text-slate-400 hover:text-indigo-600 text-xs font-bold">✏️</button>
                <button onclick="deleteItem(${item.id}, event)" class="text-slate-300 hover:text-rose-500 text-base font-bold">&times;</button>
              </div>
            </div>

            ${imgs.length > 0 ? `
              <div class="flex overflow-x-auto no-scrollbar gap-1 rounded-xl overflow-hidden">
                ${imgs.map(img => `<img src="${img}" class="h-36 w-full object-cover rounded-xl">`).join('')}
              </div>
            ` : ''}

            ${item.memo ? `
              <p class="text-xs text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded-xl text-[11px] whitespace-pre-line">${item.memo}</p>
            ` : ''}

            ${(item.tags && item.tags.length > 0) ? `
              <div class="flex flex-wrap gap-1">
                ${item.tags.map(t => `<span class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-md font-bold">#${t}</span>`).join('')}
              </div>
            ` : ''}

            ${item.url ? `
              <div class="pt-1">
                <a href="${item.url}" target="_blank" class="w-full py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-[11px] font-bold rounded-xl flex items-center justify-center gap-1">
                  🔗 원본 보기 ↗
                </a>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
