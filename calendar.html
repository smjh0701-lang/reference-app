<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스케줄 & 수익 정산 캘린더</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pin: {
              pink: '#FAA4B5',
              'pink-light': '#FFF0F3',
              fawn: '#F8B77C',
              'fawn-light': '#FFF6EE',
              maize: '#FFF183',
              'maize-light': '#FFFDE8',
              sky: '#70C1E1',
              'sky-light': '#EEF8FC',
              olivine: '#82BA88',
              'olivine-light': '#F0F7F1',
              charcoal: '#2D3139',
              muted: '#7A828E',
              border: '#F0EBE4'
            }
          },
          boxShadow: {
            'pin': '0 8px 30px -4px rgba(45, 49, 57, 0.06), 0 2px 6px -1px rgba(45, 49, 57, 0.04)',
            'pin-hover': '0 16px 36px -4px rgba(45, 49, 57, 0.12), 0 4px 12px -2px rgba(45, 49, 57, 0.06)'
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #FAF8F5;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-pin-charcoal min-h-screen pb-28">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-40 bg-[#FAF8F5]/90 backdrop-blur-xl border-b border-pin-border px-5 sm:px-10 py-4">
    <div class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-pin-sky-light border border-pin-sky/40 flex items-center justify-center text-lg shadow-sm">
          💰
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-pin-charcoal">
            협찬 · 스케줄 & 수익 캘린더
          </h1>
          <p class="text-[10px] text-pin-muted font-medium">체험단 일정 · 원고 마감 · 정산 장부</p>
        </div>
      </div>
      <button onclick="openModal()" class="flex items-center gap-1.5 px-4 py-2 bg-pin-charcoal hover:bg-black text-[#FAF8F5] rounded-full text-xs font-bold transition duration-200 shadow-sm active:scale-95">
        <span>+</span> 새 일정 / 협찬 등록
      </button>
    </div>
  </header>

  <!-- 메인 캘린더 & 수익 정산 영역 -->
  <main class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto p-4 sm:p-8 space-y-6">

    <!-- 이번 달 수익 통계 및 월 이동 바 -->
    <div class="bg-white border border-pin-border rounded-[32px] p-6 shadow-pin space-y-5">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <h2 id="currentMonthYear" class="text-xl sm:text-2xl font-black tracking-tight text-pin-charcoal"></h2>
          <div class="flex items-center gap-1.5 bg-[#FAF8F5] p-1 rounded-full border border-pin-border">
            <button onclick="changeMonth(-1)" class="w-7 h-7 rounded-full bg-white hover:bg-slate-100 flex items-center justify-center text-xs font-bold shadow-sm transition">❮</button>
            <button onclick="goToday()" class="px-3 py-1 rounded-full text-[11px] font-bold hover:bg-white transition">오늘</button>
            <button onclick="changeMonth(1)" class="w-7 h-7 rounded-full bg-white hover:bg-slate-100 flex items-center justify-center text-xs font-bold shadow-sm transition">❯</button>
          </div>
        </div>

        <!-- 실시간 정산 현황판 -->
        <div class="flex flex-wrap items-center gap-2">
          <div class="flex flex-col px-4 py-2 rounded-2xl bg-pin-fawn-light border border-pin-fawn/40">
            <span class="text-[10px] font-bold text-pin-fawn">이번 달 총 예상 수익</span>
            <span id="totalIncome" class="text-sm sm:text-base font-black text-pin-charcoal">0원</span>
          </div>
          <div class="flex flex-col px-4 py-2 rounded-2xl bg-pin-olivine-light border border-pin-olivine/40">
            <span class="text-[10px] font-bold text-pin-olivine">입금 완료</span>
            <span id="paidIncome" class="text-sm sm:text-base font-black text-pin-charcoal">0원</span>
          </div>
          <div class="flex flex-col px-4 py-2 rounded-2xl bg-pin-pink-light border border-pin-pink/40">
            <span class="text-[10px] font-bold text-pin-pink">입금 대기중</span>
            <span id="unpaidIncome" class="text-sm sm:text-base font-black text-pin-charcoal">0원</span>
          </div>
        </div>
      </div>

      <!-- 일정 유형 필터 탭 -->
      <div class="flex gap-2 overflow-x-auto no-scrollbar pt-2 border-t border-pin-border text-xs font-bold">
        <button onclick="filterCalendar('ALL')" id="filterBtn-ALL" class="px-3 py-1.5 rounded-full bg-pin-charcoal text-white shadow-sm transition">전체 일정</button>
        <button onclick="filterCalendar('방문일')" id="filterBtn-방문일" class="px-3 py-1.5 rounded-full bg-[#FAF8F5] text-pin-muted hover:text-pin-charcoal border border-pin-border transition">📸 방문일만</button>
        <button onclick="filterCalendar('원고마감')" id="filterBtn-원고마감" class="px-3 py-1.5 rounded-full bg-[#FAF8F5] text-pin-muted hover:text-pin-charcoal border border-pin-border transition">⏰ 마감일만</button>
        <button onclick="filterCalendar('정산일')" id="filterBtn-정산일" class="px-3 py-1.5 rounded-full bg-[#FAF8F5] text-pin-muted hover:text-pin-charcoal border border-pin-border transition">💰 정산일만</button>
      </div>
    </div>

    <!-- 달력 그리드 본체 -->
    <div class="bg-white border border-pin-border rounded-[32px] p-4 sm:p-7 shadow-pin overflow-hidden">
      <!-- 요일 헤더 -->
      <div class="grid grid-cols-7 text-center pb-3 border-b border-pin-border text-xs font-black text-pin-muted">
        <div class="text-rose-500">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div class="text-sky-500">토</div>
      </div>

      <!-- 날짜 셀들 -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2 pt-2 min-h-[520px]"></div>
    </div>

    <!-- 이번 달 등록된 전체 협찬 & 정산 장부 리스트 -->
    <div class="bg-white border border-pin-border rounded-[32px] p-6 shadow-pin space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-black text-pin-charcoal flex items-center gap-2">
          <span>📋</span> 이번 달 협찬 및 정산 목록
        </h3>
        <span id="monthlyItemCount" class="text-xs font-bold text-pin-muted">총 0건</span>
      </div>
      <div id="scheduleTableList" class="space-y-2.5"></div>
    </div>

  </main>

  <!-- 일정 / 협찬 등록 및 수정 모달 -->
  <div id="scheduleModal" class="fixed inset-0 bg-pin-charcoal/40 backdrop-blur-md z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="bg-[#FAF8F5] rounded-t-[32px] sm:rounded-[32px] w-full max-w-md sm:max-w-lg p-7 space-y-4 max-h-[88vh] overflow-y-auto border border-pin-border shadow-pin-hover">
      <div class="flex justify-between items-center pb-3 border-b border-pin-border">
        <h2 id="modalTitle" class="text-base font-extrabold text-pin-charcoal flex items-center gap-2">
          <span>📅</span> 새 일정 / 협찬 등록
        </h2>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white border border-pin-border text-pin-muted hover:text-pin-charcoal flex items-center justify-center text-lg font-bold transition">&times;</button>
      </div>

      <div class="space-y-3.5 text-xs">
        <div>
          <label class="block font-bold text-pin-charcoal mb-1">제목 / 업체명</label>
          <input type="text" id="inputTitle" placeholder="예: 성수 브런치 카페, 제주 독채 펜션 협찬" class="w-full px-4 py-2.5 bg-white border border-pin-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-pin-sky/60 text-pin-charcoal font-semibold">
        </div>

        <!-- 🏷️ 체험단 사이트 / 플랫폼 입력 -->
        <div>
          <label class="block font-bold text-pin-charcoal mb-1">체험단 사이트 / 플랫폼 (직접 입력 또는 선택)</label>
          <div class="flex flex-wrap gap-1.5 mb-2">
            <button type="button" onclick="setPlatform('레뷰')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold bg-white border border-pin-border hover:bg-pin-sky-light text-pin-charcoal transition">레뷰</button>
            <button type="button" onclick="setPlatform('강남맛집')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold bg-white border border-pin-border hover:bg-pin-sky-light text-pin-charcoal transition">강남맛집</button>
            <button type="button" onclick="setPlatform('디너의여왕')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold bg-white border border-pin-border hover:bg-pin-sky-light text-pin-charcoal transition">디너의여왕</button>
            <button type="button" onclick="setPlatform('미블')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold bg-white border border-pin-border hover:bg-pin-sky-light text-pin-charcoal transition">미블</button>
            <button type="button" onclick="setPlatform('포블로그')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold bg-white border border-pin-border hover:bg-pin-sky-light text-pin-charcoal transition">포블로그</button>
            <button type="button" onclick="setPlatform('인스타 DM')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold bg-white border border-pin-border hover:bg-pin-sky-light text-pin-charcoal transition">인스타 DM</button>
            <button type="button" onclick="setPlatform('개별협찬')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold bg-white border border-pin-border hover:bg-pin-sky-light text-pin-charcoal transition">개별협찬</button>
          </div>
          <input type="text" id="inputPlatform" placeholder="예: 레뷰, 강남맛집, 인스타 DM, 광고대행사 등 직접 입력" class="w-full px-4 py-2.5 bg-white border border-pin-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-pin-sky/60 text-pin-charcoal font-semibold">
        </div>

        <!-- 콘텐츠 유형 (8가지) -->
        <div>
          <label class="block font-bold text-pin-charcoal mb-1">콘텐츠 형태</label>
          <select id="inputType" class="w-full px-3.5 py-2.5 bg-white border border-pin-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-pin-sky/60 text-pin-charcoal font-bold">
            <optgroup label="🎁 체험단 / 협찬">
              <option value="블로그 게시글 체험단">✍️ 블로그 게시글 체험단</option>
              <option value="블로그 클립 체험단">🎬 블로그 클립 체험단</option>
              <option value="인스타 게시물 체험단">📸 인스타 게시물 체험단</option>
              <option value="인스타 릴스 체험단">⚡ 인스타 릴스 체험단</option>
            </optgroup>
            <optgroup label="💸 내돈내산">
              <option value="블로그 게시글 내돈내산">✍️ 블로그 게시글 내돈내산</option>
              <option value="블로그 클립 내돈내산">🎬 블로그 클립 내돈내산</option>
              <option value="인스타 게시물 내돈내산">📸 인스타 게시물 내돈내산</option>
              <option value="인스타 릴스 내돈내산">⚡ 인스타 릴스 내돈내산</option>
            </optgroup>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <!-- 분야 카테고리 -->
          <div>
            <label class="block font-bold text-pin-charcoal mb-1">분야</label>
            <select id="inputTopic" class="w-full px-3.5 py-2.5 bg-white border border-pin-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-pin-sky/60 text-pin-charcoal font-bold">
              <option value="숙박">🏨 숙박</option>
              <option value="맛집">🍽️ 맛집</option>
              <option value="여행">✈️ 여행</option>
              <option value="코스">🗺️ 코스</option>
              <option value="뷰티">💄 뷰티</option>
              <option value="기타">💡 기타</option>
            </select>
          </div>
          <!-- 캘린더 표시 성격 -->
          <div>
            <label class="block font-bold text-pin-charcoal mb-1">일정 구분</label>
            <select id="inputCategory" class="w-full px-3.5 py-2.5 bg-white border border-pin-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-pin-sky/60 text-pin-charcoal font-bold">
              <option value="방문일">📸 방문일</option>
              <option value="원고마감">⏰ 원고마감</option>
              <option value="정산일">💰 정산일</option>
              <option value="일반일정">☕ 일반일정</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block font-bold text-pin-charcoal mb-1">날짜</label>
            <input type="date" id="inputDate" class="w-full px-3.5 py-2.5 bg-white border border-pin-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-pin-sky/60 text-pin-charcoal font-bold">
          </div>
          <div>
            <label class="block font-bold text-pin-charcoal mb-1">시간 (선택)</label>
            <input type="time" id="inputTime" class="w-full px-3.5 py-2.5 bg-white border border-pin-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-pin-sky/60 text-pin-charcoal font-medium">
          </div>
        </div>

        <!-- 정산 금액 및 입금 상태 설정 -->
        <div class="p-4 bg-white rounded-2xl border border-pin-border space-y-3">
          <div>
            <label class="block font-bold text-pin-charcoal mb-1">정산/원고료 금액 (원)</label>
            <input type="number" id="inputAmount" placeholder="0 (무료 체험이면 0)" class="w-full px-3.5 py-2 bg-[#FAF8F5] border border-pin-border rounded-xl focus:outline-none focus:ring-2 focus:ring-pin-sky/60 text-pin-charcoal font-bold">
          </div>
          <div class="flex items-center gap-2 pt-1">
            <input type="checkbox" id="inputIsPaid" class="w-4 h-4 rounded text-pin-olivine focus:ring-0 accent-pin-olivine cursor-pointer">
            <label for="inputIsPaid" class="font-bold text-pin-charcoal cursor-pointer">입금 완료 처리됨</label>
          </div>
        </div>

        <div>
          <label class="block font-bold text-pin-charcoal mb-1">가이드라인 / 제공내역 / 메모</label>
          <textarea id="inputMemo" rows="3" placeholder="예: 2인 식사권 제공, 키워드 필수 3개, 사진 15장 이상" class="w-full px-4 py-3 bg-white border border-pin-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-pin-sky/60 resize-none text-pin-charcoal font-medium"></textarea>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="saveSchedule()" id="saveBtn" class="flex-1 py-3.5 bg-pin-charcoal hover:bg-black active:scale-98 text-[#FAF8F5] font-extrabold rounded-2xl text-xs transition duration-200 shadow-md">
          저장하기
        </button>
        <button id="deleteBtn" onclick="deleteSchedule()" class="hidden px-5 py-3.5 bg-rose-100 hover:bg-rose-200 text-rose-600 font-extrabold rounded-2xl text-xs transition">
          삭제
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentDate = new Date();
    let scheduleList = [];
    let editingId = null;
    let currentFilter = 'ALL';

    function setPlatform(name) {
      document.getElementById('inputPlatform').value = name;
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
      updateSummary();
      renderMonthlyList();
    }

    function goToday() {
      currentDate = new Date();
      renderCalendar();
      updateSummary();
      renderMonthlyList();
    }

    function filterCalendar(filter) {
      currentFilter = filter;
      ['ALL', '방문일', '원고마감', '정산일'].forEach(f => {
        const btn = document.getElementById(`filterBtn-${f}`);
        if (f === filter) {
          btn.className = 'px-3 py-1.5 rounded-full bg-pin-charcoal text-white shadow-sm transition';
        } else {
          btn.className = 'px-3 py-1.5 rounded-full bg-[#FAF8F5] text-pin-muted hover:text-pin-charcoal border border-pin-border transition';
        }
      });
      renderCalendar();
    }

    async function loadData() {
      const { data } = await supabaseClient.from('schedules').select('*');
      scheduleList = data || [];
      renderCalendar();
      updateSummary();
      renderMonthlyList();
    }

    function openModal(dateStr = '', item = null) {
      if (item) {
        editingId = item.id;
        document.getElementById('modalTitle').innerHTML = '<span>✏️</span> 일정 / 협찬 수정';
        document.getElementById('inputTitle').value = item.title || '';
        document.getElementById('inputPlatform').value = item.platform || '';
        document.getElementById('inputType').value = item.content_type || '블로그 게시글 체험단';
        document.getElementById('inputTopic').value = item.topic_category || '맛집';
        document.getElementById('inputCategory').value = item.category || '방문일';
        document.getElementById('inputDate').value = item.event_date || '';
        document.getElementById('inputTime').value = item.event_time || '';
        document.getElementById('inputAmount').value = item.amount || '';
        document.getElementById('inputIsPaid').checked = !!item.is_paid;
        document.getElementById('inputMemo').value = item.memo || '';
        document.getElementById('deleteBtn').classList.remove('hidden');
      } else {
        editingId = null;
        document.getElementById('modalTitle').innerHTML = '<span>📅</span> 새 일정 / 협찬 등록';
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputPlatform').value = '';
        document.getElementById('inputType').value = '블로그 게시글 체험단';
        document.getElementById('inputTopic').value = '맛집';
        document.getElementById('inputCategory').value = '방문일';
        document.getElementById('inputDate').value = dateStr || new Date().toISOString().split('T')[0];
        document.getElementById('inputTime').value = '';
        document.getElementById('inputAmount').value = '';
        document.getElementById('inputIsPaid').checked = false;
        document.getElementById('inputMemo').value = '';
        document.getElementById('deleteBtn').classList.add('hidden');
      }
      document.getElementById('scheduleModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('scheduleModal').classList.add('hidden');
      editingId = null;
    }

    async function saveSchedule() {
      const title = document.getElementById('inputTitle').value;
      const platform = document.getElementById('inputPlatform').value;
      const content_type = document.getElementById('inputType').value;
      const topic_category = document.getElementById('inputTopic').value;
      const category = document.getElementById('inputCategory').value;
      const event_date = document.getElementById('inputDate').value;
      const event_time = document.getElementById('inputTime').value;
      const amount = Number(document.getElementById('inputAmount').value) || 0;
      const is_paid = document.getElementById('inputIsPaid').checked;
      const memo = document.getElementById('inputMemo').value;

      if (!title || !event_date) return alert('제목과 날짜는 필수 입력 항목입니다.');

      const payload = { title, platform, content_type, topic_category, category, event_date, event_time, amount, is_paid, memo };

      if (editingId) {
        await supabaseClient.from('schedules').update(payload).eq('id', editingId);
      } else {
        await supabaseClient.from('schedules').insert([payload]);
      }

      closeModal();
      loadData();
    }

    async function togglePaidStatus(id, currentStatus, event) {
      if (event) event.stopPropagation();
      await supabaseClient.from('schedules').update({ is_paid: !currentStatus }).eq('id', id);
      loadData();
    }

    async function deleteSchedule() {
      if (!editingId) return;
      if (!confirm('이 일정을 삭제할까요?')) return;
      await supabaseClient.from('schedules').delete().eq('id', editingId);
      closeModal();
      loadData();
    }

    function getBadgeStyle(cat) {
      switch(cat) {
        case '방문일': return 'bg-pin-sky-light text-pin-sky border-pin-sky/40';
        case '원고마감': return 'bg-pin-pink-light text-pin-pink border-pin-pink/40';
        case '정산일': return 'bg-pin-fawn-light text-pin-fawn border-pin-fawn/40';
        default: return 'bg-pin-olivine-light text-pin-olivine border-pin-olivine/40';
      }
    }

    function getTopicEmoji(topic) {
      switch(topic) {
        case '숙박': return '🏨';
        case '맛집': return '🍽️';
        case '여행': return '✈️';
        case '코스': return '🗺️';
        case '뷰티': return '💄';
        default: return '💡';
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('currentMonthYear').innerText = `${year}년 ${month + 1}월`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      let html = '';

      for (let i = firstDayIndex; i > 0; i--) {
        html += `<div class="p-2 min-h-[95px] sm:min-h-[115px] rounded-2xl bg-slate-50/40 text-slate-300 text-xs font-semibold select-none">${prevLastDate - i + 1}</div>`;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let date = 1; date <= lastDate; date++) {
        const monthPad = String(month + 1).padStart(2, '0');
        const datePad = String(date).padStart(2, '0');
        const dateStr = `${year}-${monthPad}-${datePad}`;
        const isToday = dateStr === todayStr;

        let dayEvents = scheduleList.filter(s => s.event_date === dateStr);
        if (currentFilter !== 'ALL') {
          dayEvents = dayEvents.filter(s => s.category === currentFilter);
        }

        html += `
          <div onclick="openModal('${dateStr}')" class="p-1.5 sm:p-2.5 min-h-[95px] sm:min-h-[115px] rounded-2xl border transition-all duration-200 cursor-pointer flex flex-col justify-between hover:bg-[#FAF8F5] hover:border-pin-sky/50 ${isToday ? 'border-pin-charcoal bg-pin-maize-light/40 shadow-sm' : 'border-pin-border bg-white'}">
            <div class="flex items-center justify-between">
              <span class="text-xs sm:text-sm font-black ${isToday ? 'w-6 h-6 rounded-full bg-pin-charcoal text-white flex items-center justify-center text-[11px]' : 'text-pin-charcoal'}">${date}</span>
              ${dayEvents.length > 0 ? `<span class="text-[9px] font-bold text-pin-muted">${dayEvents.length}개</span>` : ''}
            </div>

            <div class="space-y-1 mt-1 overflow-hidden flex-1">
              ${dayEvents.slice(0, 3).map(ev => `
                <div onclick="event.stopPropagation(); openModal('', ${JSON.stringify(ev).replace(/"/g, '&quot;')})" class="text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded-lg border truncate ${getBadgeStyle(ev.category)}">
                  ${getTopicEmoji(ev.topic_category)} ${ev.title}
                </div>
              `).join('')}
              ${dayEvents.length > 3 ? `<div class="text-[9px] text-pin-muted font-bold text-center">+${dayEvents.length - 3}건 더보기</div>` : ''}
            </div>
          </div>
        `;
      }

      grid.innerHTML = html;
    }

    function updateSummary() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const prefix = `${year}-${month}`;

      const thisMonthEvents = scheduleList.filter(s => (s.event_date || '').startsWith(prefix));

      const total = thisMonthEvents.reduce((sum, cur) => sum + (Number(cur.amount) || 0), 0);
      const paid = thisMonthEvents.filter(s => s.is_paid).reduce((sum, cur) => sum + (Number(cur.amount) || 0), 0);
      const unpaid = total - paid;

      document.getElementById('totalIncome').innerText = `${total.toLocaleString()}원`;
      document.getElementById('paidIncome').innerText = `${paid.toLocaleString()}원`;
      document.getElementById('unpaidIncome').innerText = `${unpaid.toLocaleString()}원`;
    }

    function renderMonthlyList() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const prefix = `${year}-${month}`;

      const container = document.getElementById('scheduleTableList');
      const thisMonthEvents = scheduleList
        .filter(s => (s.event_date || '').startsWith(prefix))
        .sort((a, b) => new Date(a.event_date) - new Date(b.event_date));

      document.getElementById('monthlyItemCount').innerText = `총 ${thisMonthEvents.length}건`;

      if (thisMonthEvents.length === 0) {
        container.innerHTML = `<p class="py-10 text-center text-xs text-pin-muted font-medium">이번 달에 등록된 협찬/일정이 없습니다.</p>`;
        return;
      }

      container.innerHTML = thisMonthEvents.map(item => {
        const isPaid = !!item.is_paid;
        return `
          <div onclick="openModal('', ${JSON.stringify(item).replace(/"/g, '&quot;')})" class="bg-[#FAF8F5] p-4 rounded-2xl border border-pin-border hover:border-pin-charcoal/40 transition cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm">
            <div class="space-y-1.5 flex-1">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[9px] font-black px-2 py-0.5 rounded-md border ${getBadgeStyle(item.category)}">${item.category}</span>
                ${item.platform ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-pin-sky-light text-pin-sky border border-pin-sky/40">🔗 ${item.platform}</span>` : ''}
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-white border border-pin-border text-pin-charcoal">${item.content_type || '체험단'}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-white border border-pin-border text-pin-muted">${getTopicEmoji(item.topic_category)} ${item.topic_category || '기타'}</span>
                <span class="text-xs font-bold text-pin-muted ml-1">${item.event_date} ${item.event_time || ''}</span>
              </div>
              <h4 class="font-extrabold text-sm text-pin-charcoal">${item.title}</h4>
              ${item.memo ? `<p class="text-xs text-pin-muted font-medium">${item.memo}</p>` : ''}
            </div>

            <div class="flex items-center justify-between sm:justify-end gap-3 pt-2 sm:pt-0 border-t sm:border-t-0 border-pin-border/60">
              <span class="text-xs sm:text-sm font-black ${item.amount > 0 ? 'text-pin-charcoal' : 'text-pin-muted'}">
                ${item.amount > 0 ? `💰 ${Number(item.amount).toLocaleString()}원` : '무료체험/0원'}
              </span>
              ${item.amount > 0 ? `
                <button onclick="togglePaidStatus(${item.id}, ${isPaid}, event)" class="px-3 py-1.5 rounded-xl text-[11px] font-black transition-all ${isPaid ? 'bg-pin-olivine text-white shadow-sm' : 'bg-pin-pink text-pin-charcoal hover:bg-rose-200'}">
                  ${isPaid ? '✓ 입금완료' : '입금대기'}
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
