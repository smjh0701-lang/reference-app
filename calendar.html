<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스케줄 & 수익 정산 캘린더</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            palette: {
              cream: '#FFF7E6',
              'cream-card': '#FFFDF7',
              blush: '#F7C8D3',
              'blush-soft': '#FDF3F5',
              rosewood: '#B46A72',
              'rosewood-soft': '#F7EBEF',
              sage: '#A8B58A',
              'sage-soft': '#F2F5ED',
              sky: '#A9B7C6',
              'sky-soft': '#F0F4F8',
              midnight: '#2D3A47',
              muted: '#8A95A5',
              border: '#EAE2D5'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #FFF7E6;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .drag-over {
      background-color: #FDF3F5 !important;
      outline: 2px dashed #B46A72 !important;
      outline-offset: -2px;
    }
    .dragging {
      opacity: 0.45;
      transform: scale(0.97);
    }
    .touch-dragging {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.9;
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body class="text-palette-midnight min-h-screen pb-20 select-none">

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-40 bg-palette-cream/95 backdrop-blur-md border-b border-palette-border px-4 sm:px-8 py-3">
    <div class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3">
        <h1 id="currentMonthYear" class="text-lg sm:text-2xl font-black tracking-tight text-palette-midnight"></h1>
        <div class="flex items-center gap-1 bg-white/70 p-1 rounded-full border border-palette-border">
          <button onclick="changeMonth(-1)" class="w-6 h-6 rounded-full hover:bg-white flex items-center justify-center text-xs font-bold transition">❮</button>
          <button onclick="goToday()" class="px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-bold hover:bg-white transition">오늘</button>
          <button onclick="changeMonth(1)" class="w-6 h-6 rounded-full hover:bg-white flex items-center justify-center text-xs font-bold transition">❯</button>
        </div>
      </div>

      <button onclick="openModal()" class="flex items-center gap-1 px-3.5 sm:px-4 py-1.5 sm:py-2 bg-palette-midnight hover:bg-black text-palette-cream rounded-full text-xs font-black transition shadow-sm active:scale-95">
        <span>+</span> 등록
      </button>
    </div>

    <!-- 정산 요약 바 -->
    <div class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto mt-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar text-xs pb-1">
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white border border-palette-midnight/20 shrink-0 shadow-sm">
        <span class="text-[10px] font-black text-palette-midnight">✨ 총 혜택가치</span>
        <span id="grandTotal" class="font-black text-palette-midnight text-xs">0원</span>
      </div>
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-palette-sky-soft border border-palette-sky/40 shrink-0">
        <span class="text-[10px] font-bold text-palette-midnight">💵 현금 리워드</span>
        <span id="totalCash" class="font-black text-palette-midnight">0원</span>
      </div>
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-palette-sage-soft border border-palette-sage/50 shrink-0">
        <span class="text-[10px] font-bold text-palette-midnight">입금완료</span>
        <span id="paidCash" class="font-black text-palette-midnight">0원</span>
      </div>
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-palette-blush-soft border border-palette-rosewood/30 shrink-0">
        <span class="text-[10px] font-bold text-palette-rosewood">입금대기</span>
        <span id="unpaidCash" class="font-black text-palette-rosewood">0원</span>
      </div>
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-palette-rosewood-soft border border-palette-rosewood/20 shrink-0">
        <span class="text-[10px] font-bold text-palette-rosewood">🎁 협찬 제공가치</span>
        <span id="totalProductValue" class="font-black text-palette-rosewood">0원</span>
      </div>
    </div>
  </header>

  <!-- 메인 캘린더 영역 -->
  <main class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto px-1 sm:px-6 pt-2 sm:pt-4 space-y-4">
    <div class="bg-white border border-palette-border sm:rounded-[28px] shadow-sm overflow-hidden">
      <div class="grid grid-cols-7 text-center py-2 border-b border-palette-border text-[11px] sm:text-xs font-black">
        <div class="text-palette-rosewood">일</div>
        <div class="text-palette-midnight">월</div>
        <div class="text-palette-midnight">화</div>
        <div class="text-palette-midnight">수</div>
        <div class="text-palette-midnight">목</div>
        <div class="text-palette-midnight">금</div>
        <div class="text-palette-sky">토</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 border-collapse divide-x divide-y divide-palette-border/50"></div>
    </div>

    <!-- 이번 달 / 선택된 날짜 일정 목록 -->
    <div class="bg-white border border-palette-border rounded-2xl sm:rounded-[28px] p-4 sm:p-6 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <h3 id="detailListTitle" class="text-xs sm:text-sm font-black text-palette-midnight flex items-center gap-1.5">
          <span>📌</span> 이번 달 전체 일정
        </h3>
        <span id="monthlyItemCount" class="text-[11px] font-bold text-palette-muted">0건</span>
      </div>
      <div id="scheduleTableList" class="space-y-2"></div>
    </div>
  </main>

  <!-- 일정 등록 및 수정 모달 -->
  <div id="scheduleModal" class="fixed inset-0 bg-palette-midnight/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="bg-palette-cream rounded-t-[28px] sm:rounded-[28px] w-full max-w-md sm:max-w-lg p-5 sm:p-7 space-y-3.5 max-h-[88vh] overflow-y-auto border border-palette-border shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-palette-border">
        <h2 id="modalTitle" class="text-sm sm:text-base font-black text-palette-midnight flex items-center gap-1.5">
          <span>📅</span> 새 일정 / 협찬 등록
        </h2>
        <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-white border border-palette-border text-palette-muted hover:text-palette-midnight flex items-center justify-center text-base font-bold">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-palette-midnight mb-1">제목 / 업체명</label>
          <input type="text" id="inputTitle" placeholder="예: 성수 브런치 카페, 제주 독채 펜션" class="w-full px-3.5 py-2 bg-white border border-palette-border rounded-xl focus:outline-none focus:ring-2 focus:ring-palette-sky text-palette-midnight font-semibold">
        </div>

        <div>
          <label class="block font-bold text-palette-midnight mb-1">체험단 사이트 / 플랫폼</label>
          <div class="flex flex-wrap gap-1 mb-1.5">
            <button type="button" onclick="setPlatform('레뷰')" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-white border border-palette-border hover:bg-palette-blush-soft text-palette-midnight">레뷰</button>
            <button type="button" onclick="setPlatform('리뷰노트')" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-white border border-palette-border hover:bg-palette-blush-soft text-palette-midnight">리뷰노트</button>
            <button type="button" onclick="setPlatform('강남맛집')" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-white border border-palette-border hover:bg-palette-blush-soft text-palette-midnight">강남맛집</button>
            <button type="button" onclick="setPlatform('디너의여왕')" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-white border border-palette-border hover:bg-palette-blush-soft text-palette-midnight">디너의여왕</button>
            <button type="button" onclick="setPlatform('인스타 DM')" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-white border border-palette-border hover:bg-palette-blush-soft text-palette-midnight">인스타 DM</button>
            <button type="button" onclick="setPlatform('개별협찬')" class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-white border border-palette-border hover:bg-palette-blush-soft text-palette-midnight">개별협찬</button>
          </div>
          <input type="text" id="inputPlatform" placeholder="예: 레뷰, 리뷰노트, 인스타 DM 등" class="w-full px-3.5 py-2 bg-white border border-palette-border rounded-xl focus:outline-none focus:ring-2 focus:ring-palette-sky text-palette-midnight font-medium">
        </div>

        <!-- 콘텐츠 형태 태그 선택 -->
        <div>
          <label class="block font-bold text-palette-midnight mb-1">콘텐츠 형태 (중복 선택 가능)</label>
          <div class="grid grid-cols-2 gap-1.5" id="contentTypeContainer">
            <button type="button" onclick="toggleContentType('블로그 글')" data-tag="블로그 글" class="type-btn px-2.5 py-2 rounded-xl text-[11px] font-bold bg-white border border-palette-border text-palette-midnight text-left flex items-center justify-between transition">
              <span>✍️ 블로그 글</span>
              <span class="check-icon text-[10px] opacity-0">✓</span>
            </button>
            <button type="button" onclick="toggleContentType('블로그 클립')" data-tag="블로그 클립" class="type-btn px-2.5 py-2 rounded-xl text-[11px] font-bold bg-white border border-palette-border text-palette-midnight text-left flex items-center justify-between transition">
              <span>🎬 블로그 클립</span>
              <span class="check-icon text-[10px] opacity-0">✓</span>
            </button>
            <button type="button" onclick="toggleContentType('인스타 피드')" data-tag="인스타 피드" class="type-btn px-2.5 py-2 rounded-xl text-[11px] font-bold bg-white border border-palette-border text-palette-midnight text-left flex items-center justify-between transition">
              <span>📸 인스타 피드</span>
              <span class="check-icon text-[10px] opacity-0">✓</span>
            </button>
            <button type="button" onclick="toggleContentType('인스타 릴스')" data-tag="인스타 릴스" class="type-btn px-2.5 py-2 rounded-xl text-[11px] font-bold bg-white border border-palette-border text-palette-midnight text-left flex items-center justify-between transition">
              <span>⚡ 인스타 릴스</span>
              <span class="check-icon text-[10px] opacity-0">✓</span>
            </button>
            <button type="button" onclick="toggleContentType('유튜브/쇼츠')" data-tag="유튜브/쇼츠" class="type-btn px-2.5 py-2 rounded-xl text-[11px] font-bold bg-white border border-palette-border text-palette-midnight text-left flex items-center justify-between transition">
              <span>▶️ 유튜브/쇼츠</span>
              <span class="check-icon text-[10px] opacity-0">✓</span>
            </button>
            <button type="button" onclick="toggleContentType('내돈내산')" data-tag="내돈내산" class="type-btn px-2.5 py-2 rounded-xl text-[11px] font-bold bg-white border border-palette-border text-palette-midnight text-left flex items-center justify-between transition">
              <span>💸 내돈내산</span>
              <span class="check-icon text-[10px] opacity-0">✓</span>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-palette-midnight mb-1">분야</label>
            <select id="inputTopic" class="w-full px-3 py-2 bg-white border border-palette-border rounded-xl focus:outline-none focus:ring-2 focus:ring-palette-sky text-palette-midnight font-bold">
              <option value="숙박">🏨 숙박</option>
              <option value="맛집">🍽️ 맛집</option>
              <option value="여행">✈️ 여행</option>
              <option value="코스">🗺️ 코스</option>
              <option value="뷰티">💄 뷰티</option>
              <option value="기타">💡 기타</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-palette-midnight mb-1">일정 구분</label>
            <select id="inputCategory" class="w-full px-3 py-2 bg-white border border-palette-border rounded-xl focus:outline-none focus:ring-2 focus:ring-palette-sky text-palette-midnight font-bold">
              <option value="방문일">📸 방문일</option>
              <option value="원고마감">⏰ 원고마감</option>
              <option value="정산일">💰 정산일</option>
              <option value="일반일정">☕ 일반일정</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-palette-midnight mb-1">날짜</label>
            <input type="date" id="inputDate" class="w-full px-3 py-2 bg-white border border-palette-border rounded-xl focus:outline-none focus:ring-2 focus:ring-palette-sky text-palette-midnight font-bold">
          </div>
          <div>
            <label class="block font-bold text-palette-midnight mb-1">시간 (선택)</label>
            <input type="time" id="inputTime" class="w-full px-3 py-2 bg-white border border-palette-border rounded-xl focus:outline-none focus:ring-2 focus:ring-palette-sky text-palette-midnight font-medium">
          </div>
        </div>

        <div class="p-3 bg-white rounded-xl border border-palette-border space-y-2.5">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-palette-rosewood mb-1">🎁 협찬 제공가치 (원)</label>
              <input type="number" id="inputProductAmount" placeholder="예: 50000" class="w-full px-3 py-1.5 bg-palette-cream border border-palette-border rounded-lg focus:outline-none focus:ring-2 focus:ring-palette-rosewood text-palette-midnight font-bold">
            </div>
            <div>
              <label class="block font-bold text-palette-midnight mb-1">💵 현금 리워드 (원)</label>
              <input type="number" id="inputAmount" placeholder="예: 20000" class="w-full px-3 py-1.5 bg-palette-cream border border-palette-border rounded-lg focus:outline-none focus:ring-2 focus:ring-palette-sky text-palette-midnight font-bold">
            </div>
          </div>
          <div class="flex items-center gap-2 pt-1 border-t border-palette-border/50">
            <input type="checkbox" id="inputIsPaid" class="w-4 h-4 rounded text-palette-sage accent-palette-sage cursor-pointer">
            <label for="inputIsPaid" class="font-bold text-palette-midnight cursor-pointer text-[11px]">현금 리워드 입금 완료 처리됨</label>
          </div>
        </div>

        <div>
          <label class="block font-bold text-palette-midnight mb-1">메모 / 가이드라인</label>
          <textarea id="inputMemo" rows="2" placeholder="제공내역, 필수 키워드 등" class="w-full px-3 py-2 bg-white border border-palette-border rounded-xl focus:outline-none focus:ring-2 focus:ring-palette-sky resize-none text-palette-midnight font-medium"></textarea>
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="saveSchedule()" id="saveBtn" class="flex-1 py-3 bg-palette-midnight hover:bg-black active:scale-98 text-palette-cream font-black rounded-xl text-xs transition shadow-md">
          저장하기
        </button>
        <button id="deleteBtn" onclick="deleteSchedule()" class="hidden px-4 py-3 bg-palette-rosewood-soft hover:bg-palette-blush text-palette-rosewood font-black rounded-xl text-xs transition">
          삭제
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentDate = new Date();
    let scheduleList = [];
    let editingId = null;
    let selectedDateStr = null;
    let selectedTypes = [];

    let draggedItemId = null;
    let touchGhost = null;
    let currentDropTarget = null;

    function cleanContentTypes(rawTypeStr) {
      if (!rawTypeStr) return [];
      const parts = rawTypeStr.split(',').map(s => s.trim()).filter(Boolean);
      const resultSet = new Set();

      parts.forEach(p => {
        if (p.includes('블로그') && (p.includes('게시글') || p.includes('글') || p === '블로그')) {
          resultSet.add('블로그 글');
        } else if (p.includes('블로그') && p.includes('클립')) {
          resultSet.add('블로그 클립');
        } else if (p.includes('인스타') && (p.includes('게시물') || p.includes('피드') || p === '인스타')) {
          resultSet.add('인스타 피드');
        } else if (p.includes('인스타') && p.includes('릴스')) {
          resultSet.add('인스타 릴스');
        } else if (p.includes('유튜브') || p.includes('쇼츠')) {
          resultSet.add('유튜브/쇼츠');
        } else if (p.includes('내돈내산')) {
          resultSet.add('내돈내산');
        } else if (p) {
          resultSet.add(p);
        }
      });

      return Array.from(resultSet);
    }

    function parseItemData(item) {
      let product_amount = Number(item.product_amount) || 0;
      let cleanMemo = item.memo || '';

      if (!product_amount && cleanMemo.includes('[PROD_VAL:')) {
        const match = cleanMemo.match(/\[PROD_VAL:(\d+)\]/);
        if (match) {
          product_amount = Number(match[1]) || 0;
          cleanMemo = cleanMemo.replace(/\[PROD_VAL:\d+\]\n?/, '');
        }
      }

      const cleanedTypes = cleanContentTypes(item.content_type);

      return { 
        ...item, 
        parsed_product_amount: product_amount, 
        display_memo: cleanMemo,
        cleaned_types: cleanedTypes
      };
    }

    function setPlatform(name) {
      document.getElementById('inputPlatform').value = name;
    }

    function toggleContentType(typeName) {
      const idx = selectedTypes.indexOf(typeName);
      if (idx > -1) {
        selectedTypes.splice(idx, 1);
      } else {
        selectedTypes.push(typeName);
      }
      updateContentTypeUI();
    }

    function updateContentTypeUI() {
      const buttons = document.querySelectorAll('#contentTypeContainer .type-btn');
      buttons.forEach(btn => {
        const tag = btn.getAttribute('data-tag');
        const isSelected = selectedTypes.includes(tag);
        const checkIcon = btn.querySelector('.check-icon');

        if (isSelected) {
          btn.className = "type-btn px-2.5 py-2 rounded-xl text-[11px] bg-palette-blush-soft border border-palette-midnight font-black text-palette-midnight text-left flex items-center justify-between transition shadow-inner";
          if (checkIcon) checkIcon.className = "check-icon text-[10px] opacity-100 text-palette-rosewood font-black";
        } else {
          btn.className = "type-btn px-2.5 py-2 rounded-xl text-[11px] bg-white border border-palette-border font-bold text-palette-midnight text-left flex items-center justify-between transition hover:bg-palette-cream-card";
          if (checkIcon) checkIcon.className = "check-icon text-[10px] opacity-0";
        }
      });
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      selectedDateStr = null;
      renderCalendar();
      updateSummary();
      renderDetailList();
    }

    function goToday() {
      currentDate = new Date();
      selectedDateStr = new Date().toISOString().split('T')[0];
      renderCalendar();
      updateSummary();
      renderDetailList();
    }

    async function loadData() {
      try {
        const { data, error } = await supabaseClient.from('schedules').select('*');
        if (error) throw error;
        scheduleList = (data || []).map(parseItemData);
        renderCalendar();
        updateSummary();
        renderDetailList();
      } catch (err) {
        console.error("데이터 로드 실패:", err);
      }
    }

    function selectDate(dateStr) {
      selectedDateStr = dateStr;
      renderCalendar();
      renderDetailList();
    }

    function openModal(dateStr = '', item = null) {
      if (item) {
        editingId = item.id;
        document.getElementById('modalTitle').innerHTML = '<span>✏️</span> 일정 / 협찬 수정';
        document.getElementById('inputTitle').value = item.title || '';
        document.getElementById('inputPlatform').value = item.platform || '';
        
        selectedTypes = item.cleaned_types || cleanContentTypes(item.content_type);
        updateContentTypeUI();

        document.getElementById('inputTopic').value = item.topic_category || '맛집';
        document.getElementById('inputCategory').value = item.category || '방문일';
        document.getElementById('inputDate').value = item.event_date || '';
        document.getElementById('inputTime').value = item.event_time ? item.event_time.slice(0, 5) : '';
        document.getElementById('inputProductAmount').value = item.parsed_product_amount || '';
        document.getElementById('inputAmount').value = item.amount || '';
        document.getElementById('inputIsPaid').checked = !!item.is_paid;
        document.getElementById('inputMemo').value = item.display_memo || '';
        document.getElementById('deleteBtn').classList.remove('hidden');
      } else {
        editingId = null;
        document.getElementById('modalTitle').innerHTML = '<span>📅</span> 새 일정 / 협찬 등록';
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputPlatform').value = '';
        
        selectedTypes = ['블로그 글'];
        updateContentTypeUI();

        document.getElementById('inputTopic').value = '맛집';
        document.getElementById('inputCategory').value = '방문일';
        document.getElementById('inputDate').value = dateStr || selectedDateStr || new Date().toISOString().split('T')[0];
        document.getElementById('inputTime').value = '';
        document.getElementById('inputProductAmount').value = '';
        document.getElementById('inputAmount').value = '';
        document.getElementById('inputIsPaid').checked = false;
        document.getElementById('inputMemo').value = '';
        document.getElementById('deleteBtn').classList.add('hidden');
      }
      document.getElementById('scheduleModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('scheduleModal').classList.add('hidden');
      editingId = null;
    }

    async function saveSchedule() {
      const title = document.getElementById('inputTitle').value;
      const platform = document.getElementById('inputPlatform').value;
      const content_type = selectedTypes.join(', ');
      const topic_category = document.getElementById('inputTopic').value;
      const category = document.getElementById('inputCategory').value;
      const event_date = document.getElementById('inputDate').value;
      const event_time = document.getElementById('inputTime').value || null;
      const product_amount = Number(document.getElementById('inputProductAmount').value) || 0;
      const amount = Number(document.getElementById('inputAmount').value) || 0;
      const is_paid = document.getElementById('inputIsPaid').checked;
      const rawMemo = document.getElementById('inputMemo').value;

      if (!title || !event_date) return alert('제목과 날짜는 필수입니다.');

      const finalMemo = product_amount > 0 
        ? `[PROD_VAL:${product_amount}]${rawMemo ? '\n' + rawMemo : ''}` 
        : rawMemo;

      const payload = { 
        title, 
        platform, 
        content_type, 
        topic_category, 
        category, 
        event_date, 
        event_time, 
        amount, 
        is_paid, 
        memo: finalMemo 
      };

      try {
        if (editingId) {
          const { error } = await supabaseClient.from('schedules').update(payload).eq('id', editingId);
          if (error) throw error;
        } else {
          const { error } = await supabaseClient.from('schedules').insert([payload]);
          if (error) throw error;
        }
        closeModal();
        loadData();
      } catch (err) {
        alert('저장 중 오류가 발생했습니다: ' + (err.message || JSON.stringify(err)));
      }
    }

    async function togglePaidStatus(id, currentStatus, event) {
      if (event) event.stopPropagation();
      try {
        const { error } = await supabaseClient.from('schedules').update({ is_paid: !currentStatus }).eq('id', id);
        if (error) throw error;
        loadData();
      } catch (err) {
        alert('상태 변경 실패: ' + err.message);
      }
    }

    async function deleteSchedule() {
      if (!editingId) return;
      if (!confirm('이 일정을 삭제할까요?')) return;
      try {
        const { error } = await supabaseClient.from('schedules').delete().eq('id', editingId);
        if (error) throw error;
        closeModal();
        loadData();
      } catch (err) {
        alert('삭제 실패: ' + err.message);
      }
    }

    async function moveScheduleToDate(scheduleId, newDateStr) {
      if (!scheduleId || !newDateStr) return;
      const item = scheduleList.find(s => s.id == scheduleId);
      if (!item || item.event_date === newDateStr) return;

      item.event_date = newDateStr;
      renderCalendar();
      updateSummary();
      renderDetailList();

      try {
        const { error } = await supabaseClient.from('schedules').update({ event_date: newDateStr }).eq('id', scheduleId);
        if (error) throw error;
      } catch (err) {
        alert('일정 이동 중 오류가 발생했습니다: ' + err.message);
        loadData();
      }
    }

    function handleDragStart(e, id) {
      e.stopPropagation();
      draggedItemId = id;
      e.dataTransfer.setData('text/plain', id);
      e.dataTransfer.effectAllowed = 'move';
      e.currentTarget.classList.add('dragging');
    }

    function handleDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      draggedItemId = null;
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const cell = e.currentTarget;
      if (!cell.classList.contains('drag-over')) {
        cell.classList.add('drag-over');
      }
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e, targetDate) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain') || draggedItemId;
      if (id && targetDate) {
        moveScheduleToDate(id, targetDate);
      }
    }

    function handleTouchStart(e, id) {
      const touch = e.touches[0];
      draggedItemId = id;

      const target = e.currentTarget;
      touchGhost = target.cloneNode(true);
      touchGhost.classList.add('touch-dragging');
      touchGhost.style.width = `${target.offsetWidth}px`;
      touchGhost.style.left = `${touch.clientX - 20}px`;
      touchGhost.style.top = `${touch.clientY - 20}px`;
      document.body.appendChild(touchGhost);
    }

    function handleTouchMove(e) {
      if (!touchGhost) return;
      const touch = e.touches[0];
      touchGhost.style.left = `${touch.clientX - 20}px`;
      touchGhost.style.top = `${touch.clientY - 20}px`;

      const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
      const dropCell = elemBelow ? elemBelow.closest('[data-calendar-date]') : null;

      if (currentDropTarget && currentDropTarget !== dropCell) {
        currentDropTarget.classList.remove('drag-over');
      }

      if (dropCell) {
        dropCell.classList.add('drag-over');
        currentDropTarget = dropCell;
      }
    }

    function handleTouchEnd(e) {
      if (touchGhost) {
        touchGhost.remove();
        touchGhost = null;
      }
      if (currentDropTarget) {
        const targetDate = currentDropTarget.getAttribute('data-calendar-date');
        currentDropTarget.classList.remove('drag-over');
        currentDropTarget = null;
        if (draggedItemId && targetDate) {
          moveScheduleToDate(draggedItemId, targetDate);
        }
      }
      draggedItemId = null;
    }

    function getBarColor(item) {
      if (item.category === '원고마감') return 'bg-palette-blush text-palette-rosewood font-extrabold';
      if (item.category === '방문일') return 'bg-palette-sage-soft text-palette-midnight font-bold border border-palette-sage/40';
      if (item.category === '정산일') return 'bg-palette-sky-soft text-palette-midnight font-bold border border-palette-sky/40';
      return 'bg-palette-cream text-palette-midnight font-bold';
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('currentMonthYear').innerText = `${year}년 ${month + 1}월`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      let html = '';

      for (let i = firstDayIndex; i > 0; i--) {
        const d = prevLastDate - i + 1;
        html += `<div class="p-1 min-h-[85px] sm:min-h-[110px] bg-[#FAF8F5]/50 text-palette-muted/30 text-[10px] sm:text-xs font-semibold select-none flex flex-col justify-start">${d}</div>`;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let date = 1; date <= lastDate; date++) {
        const monthPad = String(month + 1).padStart(2, '0');
        const datePad = String(date).padStart(2, '0');
        const dateStr = `${year}-${monthPad}-${datePad}`;
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDateStr;

        const dayOfWeek = new Date(year, month, date).getDay();
        let dateColor = 'text-palette-midnight';
        if (dayOfWeek === 0) dateColor = 'text-palette-rosewood';
        else if (dayOfWeek === 6) dateColor = 'text-palette-sky';

        const dayEvents = scheduleList
          .filter(s => s.event_date === dateStr)
          .sort((a, b) => (a.event_time || '99:99').localeCompare(b.event_time || '99:99'));

        html += `
          <div 
            data-calendar-date="${dateStr}"
            onclick="selectDate('${dateStr}')" 
            ondragover="handleDragOver(event)"
            ondragleave="handleDragLeave(event)"
            ondrop="handleDrop(event, '${dateStr}')"
            class="p-0.5 sm:p-1.5 min-h-[85px] sm:min-h-[110px] bg-white transition-all cursor-pointer flex flex-col justify-start relative ${isSelected ? 'bg-palette-blush-soft ring-2 ring-palette-midnight ring-inset' : 'hover:bg-palette-cream-card'}">
            
            <div class="flex items-center justify-between px-1">
              <span class="text-[10px] sm:text-xs font-black ${dateColor} ${isToday ? 'w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-palette-midnight text-white flex items-center justify-center text-[9px] sm:text-[11px]' : ''}">
                ${date}
              </span>
            </div>

            <div class="space-y-0.5 mt-1 overflow-hidden w-full">
              ${dayEvents.slice(0, 3).map(ev => {
                const timeText = ev.event_time ? ev.event_time.slice(0, 5) : '';
                return `
                  <div 
                    draggable="true"
                    ondragstart="handleDragStart(event, ${ev.id})"
                    ondragend="handleDragEnd(event)"
                    ontouchstart="handleTouchStart(event, ${ev.id})"
                    ontouchmove="handleTouchMove(event)"
                    ontouchend="handleTouchEnd(event)"
                    onclick="event.stopPropagation(); openModal('', ${JSON.stringify(ev).replace(/"/g, '&quot;')})" 
                    class="cursor-grab active:cursor-grabbing text-[8px] sm:text-[10px] px-1 py-0.5 rounded-[4px] truncate leading-tight transition-transform flex items-center gap-1 ${getBarColor(ev)}"
                    title="드래그해서 날짜를 이동할 수 있습니다.">
                    ${timeText ? `<span class="opacity-75 font-semibold shrink-0 text-[7px] sm:text-[9px]">${timeText}</span>` : ''}
                    <span class="truncate">${ev.title}</span>
                  </div>
                `;
              }).join('')}
              ${dayEvents.length > 3 ? `<div class="text-[8px] text-palette-muted font-black text-center">+${dayEvents.length - 3}</div>` : ''}
            </div>
          </div>
        `;
      }

      grid.innerHTML = html;
    }

    function updateSummary() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const prefix = `${year}-${month}`;

      const thisMonthEvents = scheduleList.filter(s => (s.event_date || '').startsWith(prefix));

      const totalCash = thisMonthEvents.reduce((sum, cur) => sum + (Number(cur.amount) || 0), 0);
      const paidCash = thisMonthEvents.filter(s => s.is_paid).reduce((sum, cur) => sum + (Number(cur.amount) || 0), 0);
      const unpaidCash = totalCash - paidCash;
      
      const totalProduct = thisMonthEvents.reduce((sum, cur) => sum + (Number(cur.parsed_product_amount) || 0), 0);
      const grandTotal = totalCash + totalProduct;

      document.getElementById('grandTotal').innerText = `${grandTotal.toLocaleString()}원`;
      document.getElementById('totalCash').innerText = `${totalCash.toLocaleString()}원`;
      document.getElementById('paidCash').innerText = `${paidCash.toLocaleString()}원`;
      document.getElementById('unpaidCash').innerText = `${unpaidCash.toLocaleString()}원`;
      document.getElementById('totalProductValue').innerText = `${totalProduct.toLocaleString()}원`;
    }

    function renderDetailList() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const prefix = `${year}-${month}`;

      const container = document.getElementById('scheduleTableList');
      const titleElem = document.getElementById('detailListTitle');

      let targetEvents = [];

      if (selectedDateStr) {
        titleElem.innerHTML = `<span>📌</span> ${selectedDateStr} 일정`;
        targetEvents = scheduleList
          .filter(s => s.event_date === selectedDateStr)
          .sort((a, b) => (a.event_time || '99:99').localeCompare(b.event_time || '99:99'));
      } else {
        titleElem.innerHTML = `<span>📌</span> 이번 달 전체 일정`;
        targetEvents = scheduleList
          .filter(s => (s.event_date || '').startsWith(prefix))
          .sort((a, b) => {
            const dateComp = new Date(a.event_date) - new Date(b.event_date);
            if (dateComp !== 0) return dateComp;
            return (a.event_time || '99:99').localeCompare(b.event_time || '99:99');
          });
      }

      document.getElementById('monthlyItemCount').innerText = `${targetEvents.length}건`;

      if (targetEvents.length === 0) {
        container.innerHTML = `<p class="py-6 text-center text-xs text-palette-muted font-medium">등록된 일정이 없습니다. <button onclick="openModal('${selectedDateStr || ''}')" class="text-palette-rosewood font-bold underline ml-1">새 일정 추가</button></p>`;
        return;
      }

      container.innerHTML = targetEvents.map(item => {
        const isPaid = !!item.is_paid;
        const cashAmt = Number(item.amount) || 0;
        const prodAmt = Number(item.parsed_product_amount) || 0;
        const types = item.cleaned_types || [];
        const timeDisplay = item.event_time ? item.event_time.slice(0, 5) : '';

        return `
          <div onclick="openModal('', ${JSON.stringify(item).replace(/"/g, '&quot;')})" class="bg-palette-cream-card p-3 rounded-xl border border-palette-border hover:border-palette-midnight/40 transition cursor-pointer flex items-center justify-between gap-2 shadow-sm">
            <div class="space-y-1 overflow-hidden flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[9px] font-black px-1.5 py-0.5 rounded-md ${getBarColor(item)}">${item.category}</span>
                ${item.platform ? `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-palette-sky-soft text-palette-midnight">🔗 ${item.platform}</span>` : ''}
                ${types.map(t => `<span class="text-[9px] font-bold text-palette-midnight bg-palette-blush-soft border border-palette-blush/60 px-1.5 py-0.5 rounded-md">${t}</span>`).join('')}
                <span class="text-[10px] font-bold text-palette-muted">${item.event_date}${timeDisplay ? ` ${timeDisplay}` : ''}</span>
              </div>
              <h4 class="font-black text-xs sm:text-sm text-palette-midnight truncate">${item.title}</h4>
              ${item.display_memo ? `<p class="text-[10px] text-palette-muted truncate whitespace-pre-line">${item.display_memo}</p>` : ''}
            </div>

            <div class="flex flex-col items-end gap-1 shrink-0">
              <div class="text-right">
                ${prodAmt > 0 ? `<div class="text-[10px] font-bold text-palette-rosewood">🎁 ${prodAmt.toLocaleString()}원</div>` : ''}
                ${cashAmt > 0 ? `<div class="text-xs font-black text-palette-midnight">💵 ${cashAmt.toLocaleString()}원</div>` : ''}
                ${prodAmt === 0 && cashAmt === 0 ? `<div class="text-xs font-bold text-palette-muted">0원</div>` : ''}
              </div>
              ${cashAmt > 0 ? `
                <button onclick="togglePaidStatus(${item.id}, ${isPaid}, event)" class="px-2 py-0.5 rounded-lg text-[9px] font-black ${isPaid ? 'bg-palette-sage text-white' : 'bg-palette-blush text-palette-rosewood'}">
                  ${isPaid ? '입금완료' : '입금대기'}
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
