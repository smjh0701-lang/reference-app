<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>프롬프트 & 템플릿 보관함</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.85);
    }
  </style>
</head>
<body class="bg-slate-100/70 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-28">

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-4 sm:px-8 py-3.5 shadow-sm">
    <div class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-pink-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 text-lg">
          ⚡
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-transparent">
            프롬프트 보관함
          </h1>
          <p class="text-[10px] text-slate-400 font-semibold leading-none">원클릭 프롬프트 & 템플릿 창고</p>
        </div>
      </div>
      <button onclick="openModal()" class="flex items-center gap-1.5 px-4 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 active:scale-95 text-white rounded-2xl text-xs font-bold shadow-md shadow-indigo-500/25 transition">
        <span>+</span> 새 프롬프트
      </button>
    </div>

    <!-- 검색창 및 카테고리 필터 -->
    <div class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto mt-3.5 space-y-2.5">
      <div class="relative">
        <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍 찾고 싶은 프롬프트 제목, 본문, 태그를 검색하세요..." class="w-full px-4 py-2.5 rounded-2xl bg-slate-200/70 dark:bg-slate-800/80 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-transparent dark:border-slate-700">
      </div>
      <div id="categoryFilterList" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1"></div>
    </div>
  </header>

  <!-- 메인 프롬프트 그리드 영역 -->
  <main class="max-w-md md:max-w-5xl lg:max-w-7xl mx-auto p-4 sm:p-6">
    <div id="promptList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- 복사 완료 토스트 알림 플로팅 바 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900/90 text-white dark:bg-white dark:text-slate-900 px-5 py-2.5 rounded-full shadow-2xl backdrop-blur-md flex items-center gap-2 text-xs font-extrabold transition-all duration-300">
    <span>✨</span>
    <span id="toastMsg">클립보드에 복사되었습니다!</span>
  </div>

  <!-- 프롬프트 등록 및 수정 모달 -->
  <div id="promptModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="glass-card rounded-t-3xl sm:rounded-3xl w-full max-w-md sm:max-w-lg p-6 space-y-4 max-h-[88vh] overflow-y-auto shadow-2xl border border-white/40 dark:border-slate-800">
      <div class="flex justify-between items-center pb-2 border-b border-slate-200/60 dark:border-slate-800">
        <h2 id="modalTitle" class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
          <span>⚡</span> 프롬프트 등록
        </h2>
        <button onclick="closeModal()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl font-bold">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">프롬프트 제목</label>
          <input type="text" id="inputTitle" placeholder="예: 자소서 인사팀 기피 말버릇 필터링" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">카테고리</label>
            <select id="inputCategory" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none">
              <option value="자소서/취업">📝 자소서/취업</option>
              <option value="SNS/콘텐츠">📸 SNS/콘텐츠</option>
              <option value="블로그/원고">✍️ 블로그/원고</option>
              <option value="업무/생산성">💼 업무/생산성</option>
              <option value="기타">💡 기타</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">한줄 설명</label>
            <input type="text" id="inputDesc" placeholder="예: 대기업 인사팀 필수 체크리스트 반영" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">프롬프트 본문 ([대괄호] 변수 강조 지원)</label>
          <textarea id="inputContent" rows="6" placeholder="프롬프트 본문을 입력하세요. 변수는 [키워드], [내용] 형식으로 적어두면 강조 표시됩니다." class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none font-mono text-[11px]"></textarea>
        </div>

        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">태그 (쉼표로 구분)</label>
          <input type="text" id="inputTags" placeholder="예: 자소서, 퇴고, 대기업, 필수역량" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none">
        </div>
      </div>

      <button onclick="savePrompt()" id="saveBtn" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 active:scale-95 text-white font-extrabold rounded-2xl text-xs shadow-lg transition">
        저장하기
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CATEGORIES = ['전체', '자소서/취업', 'SNS/콘텐츠', '블로그/원고', '업무/생산성', '기타'];
    let selectedCategory = '전체';
    let cachedPrompts = [];
    let editingId = null;

    // 기본 탑재할 프리셋 프롬프트 목록
    const PRESET_PROMPTS = [
      {
        title: "대기업 인사팀 기피 말버릇 필터링 교정",
        category: "자소서/취업",
        description: "추상적 부사와 반복 말버릇을 행동 및 정량 중심으로 변환",
        content: `다음 자기소개서 초안을 아래 3가지 원칙에 맞춰 교정해줘.
1. '~한 경험이 있습니다' 반복 표현을 삭제하고, 행동 중심 문장으로 변환
2. '배웠습니다 / 느꼈습니다' 식의 단순 종결을 피하고, 배움 이후 실제 행동 변화로 연결
3. '항상 / 언제나 / 꾸준히' 같은 포괄적 부사를 정량 기반 사실 강조로 대체

[초안 내용 붙여넣기]`,
        tags: ["자소서", "문체교정", "대기업", "행동중심"]
      },
      {
        title: "AI 티 제거 & 자연스러운 대체 연결어 교정",
        category: "자소서/취업",
        description: "AI 특유의 정리형 부사를 제거하고 자연스러운 연결어로 치환",
        content: `다음 글에서 '구조적 접근', '실질적 성과', '업무 맥락', '단순히 ㅇㅇ보다는 ~', '업무 흐름' 같은 AI 특유의 상투적 표현을 제거해줘.
- 가운데점(·)과 따옴표 남발 금지
- '결국', '즉', '따라서', '다시 말해' 같은 요약형 부사 배제
- 대체 연결어 적용: '따라서' ➔ '그 결과/그래서', '이를 통해' ➔ '그 경험으로/그 덕분에', '결과적으로' ➔ '마침내/끝내'

[초안 내용 붙여넣기]`,
        tags: ["AI티제거", "퇴고", "문장다듬기", "대체어"]
      },
      {
        title: "채용공고 맞춤 역량 분석 & 자소서 설계",
        category: "자소서/취업",
        description: "공고 필수 역량과 내 프로젝트 경험을 매칭하는 전략 도출",
        content: `이 채용공고를 분석해서 인사담당자가 원하는 인재상과 핵심 키워드를 도출해줘.

[채용공고 붙여넣기]

도출된 필수 역량을 바탕으로, 내 경험 [경력/학력/프로젝트 내용]을 어떤 관점에서 어필해야 가장 설득력 있는 자기소개서가 될지 작성 전략을 세워줘.`,
        tags: ["공고분석", "인재상", "프로젝트매칭"]
      },
      {
        title: "기업 지원동기 진정성 & 비전 연결",
        category: "자소서/취업",
        description: "단순 회사 칭찬을 배제하고 최근 이슈와 나의 목표 연결",
        content: `단순히 '좋은 회사라서'가 아닌, 이 회사에서 일하고 싶다는 진정성을 담은 지원동기를 작성해줘.

- 회사 정보/최근 이슈/비전: [회사 정보 입력]
- 나의 직무 목표 및 강점: [내 강점 입력]

위 내용을 결합하여 설득력 있고 자연스럽게 연결된 지원동기를 작성해줘.`,
        tags: ["지원동기", "기업분석", "비전"]
      },
      {
        title: "인스타 릴스 3초 후킹 & 대본 구성안",
        category: "SNS/콘텐츠",
        description: "조회수 최적화 15~30초 숏폼 릴스 대본 템플릿",
        content: `주제: [주제 및 키워드]
타겟: [시청자 타겟층]

위 내용으로 15초~30초 분량의 릴스 대본을 작성해줘.
1. 초반 3초 시선 집중 후킹 멘트 및 화면 연출 구도
2. 본문 핵심 꿀팁/정보 3가지 요약
3. 저장 및 공유를 유도하는 마무리 CTA 멘트`,
        tags: ["릴스", "인스타", "대본", "숏폼"]
      }
    ];

    function renderCategoryFilters() {
      const container = document.getElementById('categoryFilterList');
      container.innerHTML = CATEGORIES.map(cat => `
        <button onclick="filterByCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedCategory === cat ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/20' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700 hover:bg-slate-50'}">
          ${cat}
        </button>
      `).join('');
    }

    function filterByCategory(cat) {
      selectedCategory = cat;
      renderCategoryFilters();
      renderList();
    }

    async function loadData() {
      const { data, error } = await supabaseClient.from('prompts').select('*');
      
      // DB가 비어있는 경우 프리셋 데이터를 자동 동기화
      if (!data || data.length === 0) {
        await supabaseClient.from('prompts').insert(PRESET_PROMPTS);
        const { data: refetched } = await supabaseClient.from('prompts').select('*');
        cachedPrompts = (refetched || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      } else {
        cachedPrompts = data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }

      renderCategoryFilters();
      renderList();
    }

    function openModal(item = null) {
      if (item) {
        editingId = item.id;
        document.getElementById('modalTitle').innerHTML = '<span>✏️</span> 프롬프트 수정';
        document.getElementById('saveBtn').innerText = '수정 완료';
        document.getElementById('inputTitle').value = item.title || '';
        document.getElementById('inputCategory').value = item.category || '기타';
        document.getElementById('inputDesc').value = item.description || '';
        document.getElementById('inputContent').value = item.content || '';
        document.getElementById('inputTags').value = (item.tags || []).join(', ');
      } else {
        editingId = null;
        document.getElementById('modalTitle').innerHTML = '<span>⚡</span> 프롬프트 등록';
        document.getElementById('saveBtn').innerText = '저장하기';
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputCategory').value = '자소서/취업';
        document.getElementById('inputDesc').value = '';
        document.getElementById('inputContent').value = '';
        document.getElementById('inputTags').value = '';
      }
      document.getElementById('promptModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('promptModal').classList.add('hidden');
      editingId = null;
    }

    async function savePrompt() {
      const title = document.getElementById('inputTitle').value;
      const category = document.getElementById('inputCategory').value;
      const description = document.getElementById('inputDesc').value;
      const content = document.getElementById('inputContent').value;
      const tagsRaw = document.getElementById('inputTags').value;

      if (!title || !content) return alert('제목과 본문은 필수 입력 사항입니다.');

      const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);
      const payload = { title, category, description, content, tags };

      if (editingId) {
        await supabaseClient.from('prompts').update(payload).eq('id', editingId);
      } else {
        await supabaseClient.from('prompts').insert([payload]);
      }

      closeModal();
      loadData();
    }

    async function deleteItem(id, event) {
      if (event) event.stopPropagation();
      if (!confirm('이 프롬프트를 삭제할까요?')) return;
      await supabaseClient.from('prompts').delete().eq('id', id);
      loadData();
    }

    function copyToClipboard(text, btnElement, event) {
      if (event) event.stopPropagation();
      
      const originalHtml = btnElement.innerHTML;
      
      navigator.clipboard.writeText(text).then(() => {
        btnElement.innerHTML = '<span>✅</span> 복사 완료!';
        btnElement.classList.replace('from-indigo-600', 'from-emerald-600');
        btnElement.classList.replace('to-violet-600', 'to-teal-600');
        showToast('클립보드 복사 완료! 바로 Ctrl+V 하세요 ✨');

        setTimeout(() => {
          btnElement.innerHTML = originalHtml;
          btnElement.classList.replace('from-emerald-600', 'from-indigo-600');
          btnElement.classList.replace('to-teal-600', 'to-violet-600');
        }, 1500);
      }).catch(() => {
        const t = document.createElement("textarea");
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        document.body.removeChild(t);
        showToast('클립보드 복사 완료! ✨');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2000);
    }

    function getCategoryBadge(cat) {
      switch(cat) {
        case '자소서/취업':
          return 'bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-800';
        case 'SNS/콘텐츠':
          return 'bg-pink-50 text-pink-600 border-pink-200 dark:bg-pink-950/60 dark:text-pink-300 dark:border-pink-800';
        case '블로그/원고':
          return 'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800';
        case '업무/생산성':
          return 'bg-amber-50 text-amber-600 border-amber-200 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800';
        default:
          return 'bg-indigo-50 text-indigo-600 border-indigo-200 dark:bg-indigo-950/60 dark:text-indigo-300 dark:border-indigo-800';
      }
    }

    function highlightVariables(text) {
      return text.replace(/\[([^\]]+)\]/g, '<span class="text-indigo-600 dark:text-indigo-300 bg-indigo-100/80 dark:bg-indigo-950 px-1 py-0.5 rounded font-bold">[$1]</span>');
    }

    function renderList() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('promptList');

      const filtered = cachedPrompts.filter(item => {
        const matchesCategory = selectedCategory === '전체' || item.category === selectedCategory;
        const matchesSearch = (item.title || '').toLowerCase().includes(search) ||
                              (item.description || '').toLowerCase().includes(search) ||
                              (item.content || '').toLowerCase().includes(search) ||
                              (item.tags || []).some(t => t.toLowerCase().includes(search));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-20 text-xs text-slate-400 font-medium">일치하는 프롬프트가 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const jsonStr = JSON.stringify(item).replace(/'/g, "&apos;");
        const safeContent = (item.content || '').replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, "\\n");

        return `
          <div class="glass-card border border-slate-200/80 dark:border-slate-800/80 rounded-3xl p-5 shadow-sm hover:shadow-xl hover:border-indigo-300 transition-all duration-300 flex flex-col justify-between space-y-4">
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border ${getCategoryBadge(item.category)}">
                  ${item.category || '기타'}
                </span>
                <div class="flex items-center gap-1">
                  <button onclick='openModal(${jsonStr})' class="p-1 text-slate-400 hover:text-indigo-600 text-xs font-bold transition">✏️</button>
                  <button onclick="deleteItem(${item.id}, event)" class="p-1 text-slate-300 hover:text-rose-500 text-base font-bold transition">&times;</button>
                </div>
              </div>

              <div>
                <h3 class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white leading-snug">${item.title}</h3>
                ${item.description ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">${item.description}</p>` : ''}
              </div>

              <div class="p-3.5 bg-slate-50 dark:bg-slate-900/60 rounded-2xl border border-slate-200/60 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 whitespace-pre-line leading-relaxed max-h-48 overflow-y-auto no-scrollbar font-mono text-[11px]">
                ${highlightVariables(item.content)}
              </div>

              ${(item.tags && item.tags.length > 0) ? `
                <div class="flex flex-wrap gap-1.5 pt-1">
                  ${item.tags.map(t => `<span class="text-[10px] text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md font-medium">#${t}</span>`).join('')}
                </div>
              ` : ''}
            </div>

            <button onclick="copyToClipboard('${safeContent}', this, event)" class="w-full py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 active:scale-95 text-white font-extrabold rounded-2xl text-xs flex items-center justify-center gap-1.5 shadow-md shadow-indigo-500/20 transition-all">
              <span>📋</span> 프롬프트 원클릭 복사
            </button>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
