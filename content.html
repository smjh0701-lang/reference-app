<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠기획 창고</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --fiery-red: #c82823;
      --fiery-red-dark: #ab1f1a;
      --floaty-blue: #a5b9d0;
      --floaty-blue-light: #edf3fa;
      --paper-cream: #faf9f7;
      --paper-border: #eae8e3;
      --steel-gray: #585755;
      --desk-bg: #f3f2ee;
    }
    body { 
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
      background-color: var(--desk-bg);
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .sticker-card {
      background-color: var(--paper-cream);
      border: 1px solid var(--paper-border);
      box-shadow: 0 2px 5px -1px rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.02);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.2s ease;
      cursor: grab;
    }
    .sticker-card:active {
      cursor: grabbing;
    }
    .sticker-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -3px rgba(0, 0, 0, 0.06);
      border-color: #d8d4cd;
    }

    .sticker-card.dragging {
      opacity: 0.35;
      transform: scale(0.96);
    }

    .drop-zone.drag-over {
      background-color: #e4e2da !important;
      border-color: #c82823 !important;
      border-style: dashed !important;
    }

    .sticker-done {
      opacity: 0.58;
      background-color: #f1efe9;
    }
    .sticker-done .sticker-title {
      text-decoration: line-through;
      color: #78716c;
    }
  </style>
</head>
<body class="text-stone-800 min-h-screen pb-32">

  <!-- 🏷️ 상단 감성 헤더 -->
  <header class="sticky top-0 z-30 bg-[#f3f2ee]/90 backdrop-blur-md px-6 sm:px-10 py-5 border-b border-stone-200/60 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <span class="w-3 h-3 rounded-full bg-[#c82823] shadow-xs"></span>
      <h1 class="text-lg font-black tracking-tight text-stone-900 flex items-center gap-2">
        <span>INSPIRATION BOARD</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-white text-stone-500 font-bold border border-stone-200/80">기획 데스크</span>
      </h1>
    </div>

    <!-- 우측 도구 바 -->
    <div class="flex flex-wrap items-center gap-2">
      <button onclick="pickRandomSticker()" class="px-3.5 py-1.5 rounded-full bg-[#e8eef6] hover:bg-[#cad7e6] text-[#2c5282] border border-[#cad7e6] text-xs font-black transition active:scale-95 flex items-center gap-1 shadow-xs">
        <span>🎲</span> 오늘 뭐 찍지?
      </button>

      <button id="hideDoneToggleBtn" onclick="toggleHideDone()" class="px-3 py-1.5 rounded-full bg-white text-stone-600 hover:text-stone-900 border border-stone-200/80 text-xs font-bold transition active:scale-95 flex items-center gap-1 shadow-xs">
        <span id="hideDoneIcon">👁️</span> <span id="hideDoneText">완료 숨김</span>
      </button>

      <button onclick="cleanDoneStickers()" title="발행완료된 스티커만 한 번에 정리" class="px-3 py-1.5 rounded-full bg-white hover:bg-stone-50 text-stone-500 hover:text-[#c82823] border border-stone-200/80 text-xs font-bold transition active:scale-95 flex items-center gap-1 shadow-xs">
        <span>🗑️</span> 완료 비우기
      </button>

      <button onclick="cleanDuplicateStickers()" class="px-3 py-1.5 rounded-full bg-white text-stone-600 hover:text-stone-900 border border-stone-200/80 text-xs font-bold transition hover:shadow-xs active:scale-95 flex items-center gap-1 shadow-xs">
        <span>🧹</span> 중복 정리
      </button>

      <button onclick="openPillarModal()" class="px-3 py-1.5 rounded-full bg-white text-stone-600 hover:text-stone-900 border border-stone-200/80 text-xs font-bold transition hover:shadow-xs shadow-xs">
        ⚙️ 기둥 관리
      </button>
      <button onclick="openBulkModal()" class="px-3.5 py-1.5 rounded-full bg-white hover:bg-stone-50 text-stone-700 border border-stone-200/80 text-xs font-extrabold transition active:scale-95 shadow-xs">
        📑 스티커 일괄 쪼개기
      </button>
      <button onclick="openModal()" class="px-4 py-1.5 rounded-full bg-[#c82823] hover:bg-[#ab1f1a] text-white text-xs font-bold shadow-xs transition active:scale-95">
        + 새 스티커
      </button>
    </div>
  </header>

  <!-- 🏛️ 메인 3열 기둥 스티커 보드 -->
  <main class="max-w-[1600px] mx-auto p-4 sm:p-8">
    <div id="boardColumns" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start"></div>
  </main>

  <!-- 🎲 오늘 뭐 찍지? 랜덤 팝업 모달 -->
  <div id="randomModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl border border-stone-200 relative overflow-hidden text-center">
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-[#c82823]"></div>
      
      <div class="pt-2">
        <span class="inline-block p-3 rounded-full bg-[#fbf0ef] text-[#c82823] text-2xl mb-2">🎲</span>
        <h3 class="text-xs font-bold text-stone-400 tracking-wider uppercase">TODAY'S PICK</h3>
        <span id="randomPillarBadge" class="inline-block mt-1 text-[11px] font-black text-[#2c5282] bg-[#e8eef6] px-2.5 py-0.5 rounded-full border border-[#cad7e6]">
          기둥 이름
        </span>
      </div>

      <div class="p-4 bg-[#faf9f7] rounded-2xl border border-[#eae8e3] my-2">
        <p id="randomStickerTitle" class="text-sm font-extrabold text-stone-800 leading-relaxed break-keep">
          추첨된 콘텐츠 문장
        </p>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="pickRandomSticker()" class="flex-1 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-xl text-xs transition active:scale-95">
          다시 뽑기 ↻
        </button>
        <button onclick="copyRandomTitle()" class="flex-1 py-2.5 bg-[#c82823] hover:bg-[#ab1f1a] text-white font-extrabold rounded-xl text-xs transition active:scale-95 shadow-xs">
          문장 복사 📋
        </button>
      </div>
      <button onclick="closeRandomModal()" class="text-xs text-stone-400 hover:text-stone-600 block w-full text-center pt-1 font-medium">닫기</button>
    </div>
  </div>

  <!-- 📑 텍스트 일괄 분해 등록 모달 -->
  <div id="bulkModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg p-6 space-y-4 shadow-2xl border border-stone-200">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <div>
          <h2 class="text-sm font-black text-stone-900">📑 텍스트 통째로 스티커 쪼개기</h2>
          <p class="text-[11px] text-stone-400 mt-0.5">글 뭉치를 넣으면 한 문장씩 예쁜 스티커로 보드에 바로 꽂힙니다.</p>
        </div>
        <button onclick="closeBulkModal()" class="text-xl font-bold text-stone-400 hover:text-stone-600">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold mb-1 text-stone-600">어느 기둥에 붙일까요?</label>
          <select id="bulkPillarSelect" class="w-full p-2.5 border border-stone-200 rounded-xl font-bold bg-[#fbfbfb] focus:outline-none focus:ring-2 focus:ring-[#a5b9d0]"></select>
        </div>

        <div>
          <label class="block font-bold mb-1 text-stone-600">텍스트 붙여넣기</label>
          <textarea id="bulkTextInput" rows="10" placeholder="기둥 1: [자유 & 여행]...
1. 평일 낮 한적할 때 떠나는 감성 숙소
2. 카메라 들고 서 있기만 해도 그림이 되는 포토존

이런 식으로 복사해둔 글을 그냥 통째로 넣으세요!" class="w-full p-3.5 border border-stone-200 rounded-2xl bg-[#fbfbfb] focus:outline-none focus:ring-2 focus:ring-[#a5b9d0] text-xs leading-relaxed"></textarea>
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="closeBulkModal()" class="flex-1 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold rounded-xl text-xs transition">취소</button>
        <button onclick="processBulkText()" class="flex-2 py-2.5 bg-[#c82823] hover:bg-[#ab1f1a] text-white font-extrabold rounded-xl text-xs transition">
          보드에 스티커 꽂기
        </button>
      </div>
    </div>
  </div>

  <!-- 📝 개별 스티커 작성 / 수정 모달 -->
  <div id="planModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl border border-stone-200">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h2 id="modalTitle" class="text-sm font-black text-stone-900">📝 스티커 메모</h2>
        <button onclick="closeModal()" class="text-xl font-bold text-stone-400 hover:text-stone-600">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold mb-1 text-stone-600">소속 기둥</label>
          <select id="inputPillar" class="w-full p-2.5 border border-stone-200 rounded-xl font-bold bg-[#fbfbfb] focus:outline-none"></select>
        </div>

        <div>
          <label class="block font-bold mb-1 text-stone-600">콘텐츠 문장 / 아이디어</label>
          <textarea id="inputTitle" rows="3" placeholder="예: 평일 낮 한적할 때 떠나는 감성 숙소 모먼트" class="w-full p-3 border border-stone-200 rounded-xl bg-[#fbfbfb] focus:outline-none focus:ring-2 focus:ring-[#a5b9d0] text-xs"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1 text-stone-600">진행 상태</label>
            <select id="inputStatus" class="w-full p-2 border border-stone-200 rounded-xl bg-[#fbfbfb] font-medium">
              <option value="아이디어">💡 아이디어</option>
              <option value="기획중">✍️ 작성/촬영중</option>
              <option value="발행대기">📅 발행 대기</option>
              <option value="발행완료">✅ 발행 완료</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-1 text-stone-600">플랫폼 / 형태</label>
            <select id="inputPlatform" class="w-full p-2 border border-stone-200 rounded-xl bg-[#fbfbfb] font-medium">
              <option value="릴스/숏폼">🎬 릴스/숏폼</option>
              <option value="인스타그램">📸 인스타 피드</option>
              <option value="블로그">📝 블로그 포스팅</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-bold mb-1 text-stone-600">가이드 문구 or 메모 (선택)</label>
          <textarea id="inputGuideText" rows="2" placeholder="필수 키워드나 연출 메모..." class="w-full p-2.5 border border-stone-200 rounded-xl bg-[#fbfbfb] focus:outline-none text-xs"></textarea>
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="closeModal()" class="flex-1 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold rounded-xl text-xs transition">취소</button>
        <button onclick="saveSticker()" class="flex-2 py-2.5 bg-[#c82823] hover:bg-[#ab1f1a] text-white font-extrabold rounded-xl text-xs transition">
          저장하기
        </button>
      </div>
    </div>
  </div>

  <!-- ⚙️ 기둥 관리 모달 -->
  <div id="pillarModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl border border-stone-200">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h2 id="modalTitlePillar" class="text-sm font-black text-stone-900">🏛️ 기둥(컬럼) 편집</h2>
        <button onclick="closePillarModal()" class="text-xl font-bold text-stone-400">&times;</button>
      </div>

      <div class="flex gap-1.5">
        <input type="text" id="newPillarInput" placeholder="새 기둥 이름" class="flex-1 px-3 py-2 text-xs border border-stone-200 rounded-xl bg-[#fbfbfb] focus:outline-none">
        <button onclick="addNewPillar()" class="px-3.5 py-2 bg-[#636260] hover:bg-stone-800 text-white font-bold text-xs rounded-xl">추가</button>
      </div>

      <div id="pillarManageList" class="space-y-1.5 max-h-60 overflow-y-auto pr-1"></div>

      <button onclick="closePillarModal()" class="w-full py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-xl text-xs">닫기</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEFAULT_PILLARS = ['자유 & 여행', '뷰티 & 착장', '퇴사자의 일상'];
    let pillarList = JSON.parse(localStorage.getItem('content_pillars')) || DEFAULT_PILLARS;
    let pillarCache = JSON.parse(localStorage.getItem('sticker_pillar_cache')) || {};
    
    let isHideDone = JSON.parse(localStorage.getItem('hide_done_stickers')) || false;
    
    let cachedData = [];
    let editingId = null;
    let draggedItemId = null;
    let currentRandomTitle = '';

    function savePillarsToStorage() {
      localStorage.setItem('content_pillars', JSON.stringify(pillarList));
      populatePillarSelects();
      renderBoard();
    }

    function savePillarCache() {
      localStorage.setItem('sticker_pillar_cache', JSON.stringify(pillarCache));
    }

    function populatePillarSelects() {
      const selects = [document.getElementById('bulkPillarSelect'), document.getElementById('inputPillar')];
      const opts = pillarList.map(p => `<option value="${p}">${p}</option>`).join('');
      selects.forEach(s => { if (s) s.innerHTML = opts; });
    }

    function toggleHideDone() {
      isHideDone = !isHideDone;
      localStorage.setItem('hide_done_stickers', JSON.stringify(isHideDone));
      updateHideDoneButtonUI();
      renderBoard();
    }

    function updateHideDoneButtonUI() {
      const btn = document.getElementById('hideDoneToggleBtn');
      const icon = document.getElementById('hideDoneIcon');
      const text = document.getElementById('hideDoneText');
      if (isHideDone) {
        btn.className = 'px-3 py-1.5 rounded-full bg-[#c82823] text-white border border-[#c82823] text-xs font-extrabold transition active:scale-95 flex items-center gap-1 shadow-xs';
        icon.innerText = '🙈';
        text.innerText = '완료 숨김 중';
      } else {
        btn.className = 'px-3 py-1.5 rounded-full bg-white text-stone-600 hover:text-stone-900 border border-stone-200/80 text-xs font-bold transition active:scale-95 flex items-center gap-1 shadow-xs';
        icon.innerText = '👁️';
        text.innerText = '완료 숨김';
      }
    }

    async function cleanDoneStickers() {
      const doneItems = cachedData.filter(i => i.status === '발행완료');
      if (doneItems.length === 0) return alert('발행 완료된 스티커가 없습니다.');

      if (!confirm(`발행 완료된 스티커 ${doneItems.length}개를 보드에서 영구 삭제하시겠습니까?`)) return;

      const doneIds = doneItems.map(i => i.id);

      cachedData = cachedData.filter(i => i.status !== '발행완료');
      doneIds.forEach(id => delete pillarCache[id]);
      savePillarCache();
      renderBoard();

      const { error } = await supabaseClient.from('content_plans').delete().in('id', doneIds);
      if (error) {
        alert('삭제 실패: ' + error.message);
        loadData();
      } else {
        alert(`🧹 완료된 스티커 ${doneIds.length}개를 깨끗이 정리했습니다!`);
      }
    }

    function pickRandomSticker() {
      const pool = cachedData.filter(i => i.status !== '발행완료');
      if (pool.length === 0) {
        return alert('추첨할 진행 중인 아이디어 스티커가 없습니다.');
      }

      const picked = pool[Math.floor(Math.random() * pool.length)];
      const pillar = picked.pillar || pillarCache[picked.id] || pillarList[0];

      currentRandomTitle = picked.title;
      document.getElementById('randomPillarBadge').innerText = `🏛️ ${pillar}`;
      document.getElementById('randomStickerTitle').innerText = picked.title;
      document.getElementById('randomModal').classList.remove('hidden');
    }

    function closeRandomModal() {
      document.getElementById('randomModal').classList.add('hidden');
    }

    function copyRandomTitle() {
      if (!currentRandomTitle) return;
      navigator.clipboard.writeText(currentRandomTitle).then(() => {
        alert('📋 오늘의 추천 문장이 복사되었습니다!');
      });
    }

    function openPillarModal() {
      renderPillarManageList();
      document.getElementById('newPillarInput').value = '';
      document.getElementById('pillarModal').classList.remove('hidden');
    }
    function closePillarModal() {
      document.getElementById('pillarModal').classList.add('hidden');
    }
    function renderPillarManageList() {
      const list = document.getElementById('pillarManageList');
      list.innerHTML = pillarList.map((p, idx) => `
        <div class="p-2 bg-stone-50 border border-stone-200 rounded-xl flex items-center justify-between text-xs font-bold">
          <span class="text-stone-700">🏛️ ${p}</span>
          <div class="flex items-center gap-1">
            <button onclick="editPillarName(${idx})" class="text-stone-400 hover:text-stone-700">✏️</button>
            <button onclick="deletePillar(${idx})" class="text-stone-300 hover:text-[#c82823] text-sm font-bold">&times;</button>
          </div>
        </div>
      `).join('');
    }
    function addNewPillar() {
      const input = document.getElementById('newPillarInput');
      const val = input.value.trim();
      if (!val) return;
      if (!pillarList.includes(val)) pillarList.push(val);
      savePillarsToStorage();
      renderPillarManageList();
      input.value = '';
    }

    // 🌟 핵심 수정: 기둥명 변경 시 기존 스티커들의 기둥명도 모두 새 이름으로 즉시 교체!
    async function editPillarName(idx) {
      const oldName = pillarList[idx];
      const newName = prompt('기둥 이름 수정:', oldName);
      if (!newName || !newName.trim() || newName.trim() === oldName) return;

      const trimmedNewName = newName.trim();
      pillarList[idx] = trimmedNewName;

      // 1. 메모리에 있는 스티커들의 기둥 이름 일괄 변경
      cachedData.forEach(item => {
        if (item.pillar === oldName || pillarCache[item.id] === oldName) {
          item.pillar = trimmedNewName;
          pillarCache[item.id] = trimmedNewName;
        }
      });

      // 2. 로컬 캐시 전체에서 oldName 매핑 교체
      Object.keys(pillarCache).forEach(k => {
        if (pillarCache[k] === oldName) pillarCache[k] = trimmedNewName;
      });

      savePillarCache();
      savePillarsToStorage();
      renderPillarManageList();

      // 3. Supabase DB에서도 기존 pillar 값 일괄 업데이트 시도
      await supabaseClient.from('content_plans').update({ pillar: trimmedNewName }).eq('pillar', oldName);
    }

    function deletePillar(idx) {
      const target = pillarList[idx];
      if (!confirm(`'${target}' 기둥을 삭제하시겠습니까?\n해당 기둥의 스티커들은 첫 번째 기둥으로 안전하게 이동됩니다.`)) return;
      
      pillarList.splice(idx, 1);
      const fallbackPillar = pillarList[0] || '기본';

      // 삭제된 기둥에 속해 있던 스티커들을 첫 번째 기둥으로 안전하게 이동
      cachedData.forEach(item => {
        if (item.pillar === target || pillarCache[item.id] === target) {
          item.pillar = fallbackPillar;
          pillarCache[item.id] = fallbackPillar;
        }
      });

      savePillarCache();
      savePillarsToStorage();
      renderPillarManageList();
    }

    function openBulkModal() {
      populatePillarSelects();
      document.getElementById('bulkTextInput').value = '';
      document.getElementById('bulkModal').classList.remove('hidden');
    }
    function closeBulkModal() {
      document.getElementById('bulkModal').classList.add('hidden');
    }
    async function processBulkText() {
      const raw = document.getElementById('bulkTextInput').value;
      if (!raw.trim()) return alert('텍스트를 넣어주세요.');

      const targetPillar = document.getElementById('bulkPillarSelect').value;
      const lines = raw.split('\n');
      const cleanItems = [];

      lines.forEach(l => {
        let t = l.trim();
        if (!t) return;
        if (t.startsWith('기둥') || t.includes('풀세트') || t.includes('콘텐츠 주제')) return;
        t = t.replace(/^[\d\.\-\*\•\s]+/, '').trim();
        if (t.length > 2) cleanItems.push(t);
      });

      if (cleanItems.length === 0) return alert('유효한 문장을 찾지 못했습니다.');

      const payload = cleanItems.map(title => ({
        title: title,
        pillar: targetPillar,
        memo_type: 'plan',
        status: '아이디어',
        platform: '릴스/숏폼'
      }));

      let res = await supabaseClient.from('content_plans').insert(payload).select();
      if (res.error && res.error.message.includes('pillar')) {
        const fallback = cleanItems.map(title => ({
          title: title,
          memo_type: 'plan',
          status: '아이디어',
          platform: '릴스/숏폼'
        }));
        res = await supabaseClient.from('content_plans').insert(fallback).select();
      }

      if (res.data) {
        res.data.forEach(item => {
          pillarCache[item.id] = targetPillar;
        });
        savePillarCache();
      }

      closeBulkModal();
      loadData();
    }

    function openModal(item = null, defaultPillar = '') {
      populatePillarSelects();
      if (item) {
        editingId = item.id;
        document.getElementById('modalTitle').innerText = '✏️ 스티커 수정';
        document.getElementById('inputTitle').value = item.title || '';
        document.getElementById('inputPillar').value = item.pillar || defaultPillar || pillarList[0];
        document.getElementById('inputStatus').value = item.status || '아이디어';
        document.getElementById('inputPlatform').value = item.platform || '릴스/숏폼';
        document.getElementById('inputGuideText').value = item.guide_text || '';
      } else {
        editingId = null;
        document.getElementById('modalTitle').innerText = '📝 새 스티커 작성';
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputPillar').value = defaultPillar || pillarList[0];
        document.getElementById('inputStatus').value = '아이디어';
        document.getElementById('inputPlatform').value = '릴스/숏폼';
        document.getElementById('inputGuideText').value = '';
      }
      document.getElementById('planModal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('planModal').classList.add('hidden');
    }

    async function saveSticker() {
      const title = document.getElementById('inputTitle').value.trim();
      if (!title) return alert('내용을 입력해주세요.');

      const pillar = document.getElementById('inputPillar').value;
      const status = document.getElementById('inputStatus').value;
      const platform = document.getElementById('inputPlatform').value;
      const guide_text = document.getElementById('inputGuideText').value.trim();

      const payload = { title, pillar, status, platform, guide_text, memo_type: 'plan' };

      if (editingId) {
        pillarCache[editingId] = pillar;
        savePillarCache();

        let res = await supabaseClient.from('content_plans').update(payload).eq('id', editingId);
        if (res.error && res.error.message.includes('pillar')) {
          delete payload.pillar;
          await supabaseClient.from('content_plans').update(payload).eq('id', editingId);
        }
      } else {
        let res = await supabaseClient.from('content_plans').insert([payload]).select();
        if (res.error && res.error.message.includes('pillar')) {
          delete payload.pillar;
          res = await supabaseClient.from('content_plans').insert([payload]).select();
        }
        if (res.data && res.data[0]) {
          pillarCache[res.data[0].id] = pillar;
          savePillarCache();
        }
      }

      closeModal();
      loadData();
    }

    async function deleteSticker(id, event) {
      if (event) event.stopPropagation();
      if (!confirm('이 스티커를 뗄까요?')) return;

      cachedData = cachedData.filter(i => String(i.id) !== String(id));
      delete pillarCache[id];
      savePillarCache();
      renderBoard();

      const { error } = await supabaseClient.from('content_plans').delete().eq('id', id);
      if (error) {
        alert('삭제 실패: ' + error.message);
        loadData();
      }
    }

    async function cleanDuplicateStickers() {
      if (cachedData.length === 0) return alert('정리할 스티커가 없습니다.');

      const seenTitles = new Set();
      const duplicateIds = [];

      cachedData.forEach(item => {
        const cleanTitle = (item.title || '').replace(/\s+/g, '').toLowerCase();
        if (!cleanTitle) return;

        if (seenTitles.has(cleanTitle)) {
          duplicateIds.push(item.id);
        } else {
          seenTitles.add(cleanTitle);
        }
      });

      if (duplicateIds.length === 0) {
        return alert('✨ 완벽해요! 중복된 스티커가 없습니다.');
      }

      if (!confirm(`중복된 스티커가 총 ${duplicateIds.length}개 발견되었습니다.\n동일한 스티커를 정리하시겠습니까?`)) {
        return;
      }

      cachedData = cachedData.filter(i => !duplicateIds.includes(i.id));
      duplicateIds.forEach(id => delete pillarCache[id]);
      savePillarCache();
      renderBoard();

      const { error } = await supabaseClient.from('content_plans').delete().in('id', duplicateIds);
      if (error) {
        alert('중복 삭제 실패: ' + error.message);
        loadData();
      } else {
        alert(`🧹 중복 스티커 ${duplicateIds.length}개를 정리했습니다!`);
      }
    }

    function copyTitle(title, event) {
      if (event) event.stopPropagation();
      navigator.clipboard.writeText(title).then(() => {
        alert('📋 문장이 클립보드에 복사되었습니다!');
      });
    }

    async function toggleDone(id, currentStatus, event) {
      if (event) event.stopPropagation();
      const nextStatus = currentStatus === '발행완료' ? '아이디어' : '발행완료';
      
      const item = cachedData.find(i => String(i.id) === String(id));
      if (item) {
        item.status = nextStatus;
        renderBoard();
      }

      await supabaseClient.from('content_plans').update({ status: nextStatus }).eq('id', id);
    }

    function getPlatformTint(platform) {
      switch (platform) {
        case '블로그':
          return { bg: 'bg-[#52796f]', label: '블로그' };
        case '인스타그램':
          return { bg: 'bg-[#c82823]', label: '인스타' };
        default:
          return { bg: 'bg-[#5978a2]', label: '숏폼/릴스' };
      }
    }

    function handleDragStart(e, id) {
      draggedItemId = id;
      e.target.classList.add('dragging');
      e.dataTransfer.setData('text/plain', String(id));
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      document.querySelectorAll('.drop-zone').forEach(el => el.classList.remove('drag-over'));
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const col = e.currentTarget;
      if (!col.classList.contains('drag-over')) {
        col.classList.add('drag-over');
      }
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    async function handleDrop(e, targetPillar) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');

      if (!draggedItemId) return;

      const item = cachedData.find(i => String(i.id) === String(draggedItemId));
      if (!item) return;

      item.pillar = targetPillar;
      pillarCache[item.id] = targetPillar;
      savePillarCache();
      renderBoard();

      const { error } = await supabaseClient.from('content_plans').update({ pillar: targetPillar }).eq('id', draggedItemId);
      if (error && !error.message.includes('pillar')) {
        console.error('DB 기둥 업데이트 오류:', error);
      }
    }

    // 🎨 보드 렌더링 (미아 스티커 방지 로직 적용)
    function renderBoard() {
      const container = document.getElementById('boardColumns');
      container.innerHTML = '';

      pillarList.forEach((pillar, pillarIdx) => {
        let pillarItems = cachedData.filter(i => {
          let itemPillar = i.pillar || pillarCache[i.id];
          
          // 만약 어떤 기둥에도 매칭되지 않는 옛날 기둥 이름인 경우 첫 번째 컬럼에 자동 배정
          if (!pillarList.includes(itemPillar)) {
            if (pillarIdx === 0) return true;
            return false;
          }
          return itemPillar === pillar;
        });

        if (isHideDone) {
          pillarItems = pillarItems.filter(i => i.status !== '발행완료');
        }

        const colHtml = `
          <div class="drop-zone flex flex-col bg-[#eceae4]/70 rounded-3xl p-4 border border-[#e2dfd7] transition min-h-[520px]"
               ondragover="handleDragOver(event)" 
               ondragleave="handleDragLeave(event)" 
               ondrop="handleDrop(event, '${pillar}')">
            
            <div class="flex items-center justify-between px-2 py-2 mb-2">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#c82823]"></span>
                <h3 class="font-black text-sm text-stone-900 tracking-tight">${pillar}</h3>
                <span class="text-[11px] font-extrabold text-stone-400 bg-white px-2 py-0.5 rounded-full border border-stone-200/60">${pillarItems.length}</span>
              </div>
              <button onclick="openModal(null, '${pillar}')" class="text-xs font-bold text-stone-400 hover:text-stone-800 p-1 transition">
                + 추가
              </button>
            </div>

            <div class="space-y-3 flex-1 overflow-y-auto max-h-[75vh] pr-1 no-scrollbar">
              ${pillarItems.length === 0 ? `
                <div class="py-16 text-center text-xs text-stone-400 border border-dashed border-stone-300/80 rounded-2xl flex flex-col items-center justify-center gap-1">
                  <span>여기로 스티커를</span>
                  <span>드래그해서 옮겨보세요!</span>
                </div>
              ` : pillarItems.map(item => {
                const isDone = item.status === '발행완료';
                const tint = getPlatformTint(item.platform);

                return `
                  <div draggable="true" 
                       ondragstart="handleDragStart(event, ${item.id})" 
                       ondragend="handleDragEnd(event)"
                       onclick='openModal(${JSON.stringify(item).replace(/'/g, "&apos;")}, "${pillar}")' 
                       class="sticker-card ${isDone ? 'sticker-done' : ''} p-3.5 sm:p-4 rounded-2xl relative group flex flex-col justify-between gap-2.5 overflow-hidden">
                    
                    <div class="absolute top-0 left-0 right-0 h-1 ${tint.bg}"></div>

                    <div class="flex items-center justify-between pt-0.5">
                      <div class="flex items-center gap-1.5">
                        <button onclick="toggleDone(${item.id}, '${item.status || '아이디어'}', event)" 
                                title="완료 체크" 
                                class="w-4 h-4 rounded-full border border-stone-300 flex items-center justify-center text-[10px] font-black transition ${isDone ? 'bg-stone-500 border-stone-500 text-white' : 'hover:border-stone-500 text-transparent hover:text-stone-400'}">
                          ✓
                        </button>
                        <span class="text-[9px] font-extrabold text-stone-400 tracking-wider uppercase">${tint.label}</span>
                      </div>
                      
                      <div class="flex items-center gap-1">
                        <button onclick="copyTitle('${item.title.replace(/'/g, "\\'")}', event)" title="문장 복사" class="opacity-0 group-hover:opacity-100 text-stone-400 hover:text-stone-800 text-xs p-0.5 transition">📋</button>
                        <button onclick="deleteSticker(${item.id}, event)" title="삭제" class="opacity-0 group-hover:opacity-100 text-stone-300 hover:text-[#c82823] text-sm font-bold p-0.5 transition">&times;</button>
                      </div>
                    </div>

                    <p class="sticker-title text-[13px] font-semibold text-stone-800 leading-relaxed break-keep pointer-events-none">
                      ${item.title}
                    </p>

                    <div class="flex items-center justify-between pt-1 border-t border-stone-100/80 pointer-events-none text-[10px]">
                      <span class="font-bold text-stone-400">
                        ${item.status || '아이디어'}
                      </span>
                      <span class="font-bold text-stone-300 group-hover:text-stone-500 transition">⠿ 드래그 이동</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        container.innerHTML += colHtml;
      });
    }

    async function loadData() {
      const { data } = await supabaseClient.from('content_plans').select('*');
      cachedData = (data || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      cachedData.forEach(item => {
        if (!item.pillar && pillarCache[item.id]) {
          item.pillar = pillarCache[item.id];
        } else if (item.pillar) {
          pillarCache[item.id] = item.pillar;
        }
      });
      savePillarCache();

      updateHideDoneButtonUI();
      renderBoard();
    }

    populatePillarSelects();
    loadData();
  </script>
</body>
</html>
