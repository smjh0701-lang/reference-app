<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠기획 창고</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-28">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 px-6 py-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">📝</span>
        <h1 class="text-xl font-black tracking-tight bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-transparent">
          콘텐츠기획 창고
        </h1>
      </div>
      <button onclick="openModal()" class="flex items-center gap-1.5 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-full text-xs font-bold shadow-md transition">
        <span>+</span> 정식 기획 작성
      </button>
    </div>

    <!-- 탭 선택 (기획목록 / 달력 / 간단메모) -->
    <div class="max-w-7xl mx-auto mt-4 flex bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl gap-1">
      <button id="tabPlan" onclick="switchTab('plan')" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-white dark:bg-slate-900 text-indigo-600 shadow-sm transition">
        📋 기획 목록
      </button>
      <button id="tabCalendar" onclick="switchTab('calendar')" class="flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 dark:text-slate-400 transition">
        📅 달력 보기
      </button>
      <button id="tabMemo" onclick="switchTab('quick_memo')" class="flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 dark:text-slate-400 transition">
        💡 간단 메모
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-4 sm:space-y-6">

    <!-- 💰 정산 현황 대시보드 (슬림 칩 스타일) -->
    <div id="payDashboard" class="flex items-center justify-between gap-2 bg-white dark:bg-slate-900 px-4 py-2.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm text-xs">
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-bold text-slate-400">정산현황</span>
        <div class="h-3 w-px bg-slate-200 dark:bg-slate-700"></div>
        <div class="flex items-center gap-1.5 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 px-2.5 py-1 rounded-xl font-bold border border-emerald-200/60 dark:border-emerald-800/60">
          <span>🟢 입금 완료</span>
          <span id="totalDonePay" class="font-extrabold">0원</span>
        </div>
        <div class="flex items-center gap-1.5 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 px-2.5 py-1 rounded-xl font-bold border border-amber-200/60 dark:border-amber-800/60">
          <span>⏳ 입금 대기</span>
          <span id="totalPendingPay" class="font-extrabold">0원</span>
        </div>
      </div>
    </div>

    <!-- ⚡ 빠른 아이디어 메모 입력 창 -->
    <div class="bg-gradient-to-r from-amber-50 to-orange-50 dark:from-amber-950/30 dark:to-orange-950/20 border border-amber-200/80 dark:border-amber-800/50 p-4 rounded-2xl shadow-sm space-y-2">
      <div class="flex items-center justify-between text-xs font-bold text-amber-900 dark:text-amber-300">
        <span id="quickMemoLabel">⚡ 생각나는 아이디어 빠르게 적기</span>
        <button id="cancelMemoEditBtn" onclick="cancelQuickMemoEdit()" class="hidden text-xs text-amber-700 hover:underline">취소</button>
      </div>
      <div class="flex gap-2">
        <input type="text" id="quickMemoInput" placeholder="예: 봄 시즌 제주도 카페 릴스 구도 생각남..." class="flex-1 px-4 py-3 text-xs rounded-xl border border-amber-300/80 dark:border-amber-700 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white">
        <button id="quickMemoSaveBtn" onclick="saveQuickMemo()" class="px-5 py-3 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold rounded-xl text-xs whitespace-nowrap shadow-md transition">
          등록
        </button>
      </div>
    </div>

    <!-- 📅 달력 영역 -->
    <div id="calendarView" class="hidden bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-4">
      <div class="flex items-center justify-between">
        <button onclick="changeMonth(-1)" class="px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-600 font-bold text-xs">◀ 이전달</button>
        <h2 id="calendarTitle" class="font-black text-base text-slate-800 dark:text-slate-100">2026년 4월</h2>
        <button onclick="changeMonth(1)" class="px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-600 font-bold text-xs">다음달 ▶</button>
      </div>

      <!-- 일정 유형 범례 표 -->
      <div class="flex flex-wrap gap-2 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl text-[11px] font-bold border border-slate-100 dark:border-slate-800">
        <span class="text-slate-400 font-bold">구분 색상:</span>
        <span class="bg-emerald-500 text-white px-2 py-0.5 rounded">🟩 블로그 방문일</span>
        <span class="bg-teal-600 text-white px-2 py-0.5 rounded">📗 블로그 마감일</span>
        <span class="bg-purple-500 text-white px-2 py-0.5 rounded">🟪 인스타 방문일</span>
        <span class="bg-pink-500 text-white px-2 py-0.5 rounded">📕 인스타 마감일</span>
        <span class="bg-indigo-500 text-white px-2 py-0.5 rounded">📘 일반 마감/일정</span>
      </div>

      <div class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-400 pb-2 border-b">
        <span class="text-rose-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-indigo-500">토</span>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-2 text-xs"></div>
    </div>

    <!-- 카드 리스트 출력 영역 (모바일: 2열 / PC: 4열) -->
    <div id="contentList" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></div>
  </main>

  <!-- 📝 정식 기획 등록/수정 모달 -->
  <div id="planModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b">
        <h2 id="modalTitle" class="text-base font-extrabold">📝 콘텐츠 기획서 작성</h2>
        <button onclick="closeModal()" class="text-xl font-bold text-slate-400 hover:text-slate-600">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">기획 제목 / 주제</label>
          <input type="text" id="inputTitle" placeholder="예: 3월 여행지 추천 TOP 5 카드뉴스" class="w-full px-3.5 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">채널 선택</label>
            <select id="inputPlatform" class="w-full px-3 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
              <option value="인스타그램">📸 인스타그램</option>
              <option value="블로그">📝 블로그</option>
              <option value="공통">🌐 공통 (인스타+블로그)</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">진행 상태</label>
            <select id="inputStatus" class="w-full px-3 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
              <option value="아이디어">💡 아이디어단계</option>
              <option value="기획중">✍️ 기획/작성 중</option>
              <option value="발행대기">📅 발행 대기</option>
              <option value="발행완료">✅ 발행 완료</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">📅 날짜 구분</label>
            <select id="inputScheduleType" class="w-full px-3 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
              <option value="일반마감">📘 일반 마감일</option>
              <option value="블로그방문">🟩 블로그 방문일</option>
              <option value="블로그마감">📗 블로그 마감일</option>
              <option value="인스타방문">🟪 인스타 방문일</option>
              <option value="인스타마감">📕 인스타 마감일</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">📅 해당 날짜</label>
            <input type="date" id="inputDueDate" class="w-full px-3.5 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
          </div>
        </div>

        <!-- 💰 정산 관련 입력 -->
        <div class="grid grid-cols-2 gap-2 border-t pt-3">
          <div>
            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">💵 원고료 (숫자만)</label>
            <input type="number" id="inputPayAmount" placeholder="예: 150000" class="w-full px-3.5 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">입금 상태</label>
            <select id="inputPayStatus" class="w-full px-3 py-2.5 border rounded-xl dark:bg-slate-800 focus:outline-none">
              <option value="대기">⏳ 입금 대기</option>
              <option value="완료">🟢 입금 완료</option>
            </select>
          </div>
        </div>

        <!-- 🔗 레퍼런스모음집 연동 영역 -->
        <div class="border-t pt-3 space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="font-extrabold text-indigo-600 dark:text-indigo-400">✨ 레퍼런스모음집 연동</label>
            <button type="button" onclick="openRefPicker()" class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-lg text-[11px] font-bold hover:bg-indigo-100 transition">
              + 레퍼런스 가져오기
            </button>
          </div>
          <div id="selectedRefArea" class="flex flex-wrap gap-1">
            <span class="text-[11px] text-slate-400">선택된 레퍼런스가 없습니다.</span>
          </div>
        </div>

        <!-- 🤝 광고주 가이드라인 -->
        <div class="border-t pt-3 space-y-2">
          <label class="block font-extrabold text-indigo-600 dark:text-indigo-400">🤝 광고주 가이드라인</label>
          <textarea id="inputGuideText" rows="3" placeholder="광고주가 전달해준 필수 키워드, 가이드 문구를 통째로 붙여넣으세요." class="w-full px-3.5 py-2.5 border rounded-xl dark:bg-slate-800 resize-none focus:outline-none"></textarea>
        </div>
      </div>

      <button onclick="savePlan()" id="saveBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-extrabold rounded-2xl text-xs shadow-lg transition">
        기획서 저장하기
      </button>
    </div>
  </div>

  <!-- 🔗 레퍼런스 선택 팝업 모달 -->
  <div id="refModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md p-5 space-y-3 max-h-[75vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 class="font-extrabold text-sm">✨ 레퍼런스모음집에서 선택</h3>
        <button onclick="closeRefPicker()" class="text-lg font-bold text-slate-400">&times;</button>
      </div>
      <div id="refPickerList" class="flex-1 overflow-y-auto space-y-2 no-scrollbar"></div>
      <button onclick="closeRefPicker()" class="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs">선택 완료</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mvgxqnqucbcipyrwdalj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVLqAIRv6aOk8O8wWmzUPg_BGlTVZwb";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentTab = 'plan';
    let cachedData = [];
    let referenceList = [];
    let selectedRefIds = new Set();
    let editingId = null;
    let editingMemoId = null;

    let calDate = new Date();

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabPlan').className = tab === 'plan' ? 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-white dark:bg-slate-900 text-indigo-600 shadow-sm' : 'flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-500';
      document.getElementById('tabCalendar').className = tab === 'calendar' ? 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-white dark:bg-slate-900 text-indigo-600 shadow-sm' : 'flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-500';
      document.getElementById('tabMemo').className = tab === 'quick_memo' ? 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-white dark:bg-slate-900 text-amber-600 shadow-sm' : 'flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-500';

      if (tab === 'calendar') {
        document.getElementById('calendarView').classList.remove('hidden');
        renderCalendar();
      } else {
        document.getElementById('calendarView').classList.add('hidden');
      }

      renderList();
    }

    async function saveQuickMemo() {
      const input = document.getElementById('quickMemoInput');
      const val = input.value.trim();
      if (!val) return alert('메모 내용을 입력해주세요.');

      if (editingMemoId) {
        await supabaseClient.from('content_plans').update({ title: val }).eq('id', editingMemoId);
        editingMemoId = null;
        document.getElementById('quickMemoSaveBtn').innerText = '등록';
        document.getElementById('quickMemoLabel').innerText = '⚡ 생각나는 아이디어 빠르게 적기';
        document.getElementById('cancelMemoEditBtn').classList.add('hidden');
      } else {
        await supabaseClient.from('content_plans').insert([{
          title: val,
          memo_type: 'quick_memo',
          status: '아이디어'
        }]);
      }

      input.value = '';
      loadData();
    }

    function editQuickMemo(id, text) {
      editingMemoId = id;
      document.getElementById('quickMemoInput').value = text;
      document.getElementById('quickMemoSaveBtn').innerText = '수정 완료';
      document.getElementById('quickMemoLabel').innerText = '✏️ 메모 내용 수정 중...';
      document.getElementById('cancelMemoEditBtn').classList.remove('hidden');
      document.getElementById('quickMemoInput').focus();
    }

    function cancelQuickMemoEdit() {
      editingMemoId = null;
      document.getElementById('quickMemoInput').value = '';
      document.getElementById('quickMemoSaveBtn').innerText = '등록';
      document.getElementById('quickMemoLabel').innerText = '⚡ 생각나는 아이디어 빠르게 적기';
      document.getElementById('cancelMemoEditBtn').classList.add('hidden');
    }

    function openModal(item = null) {
      if (item) {
        editingId = item.id;
        document.getElementById('modalTitle').innerText = '✏️ 콘텐츠 기획서 수정';
        document.getElementById('saveBtn').innerText = '기획서 수정하기';
        document.getElementById('inputTitle').value = item.title || '';
        document.getElementById('inputPlatform').value = item.platform || '공통';
        document.getElementById('inputStatus').value = item.status || '기획중';
        document.getElementById('inputScheduleType').value = item.schedule_type || '일반마감';
        document.getElementById('inputDueDate').value = item.due_date || '';
        document.getElementById('inputPayAmount').value = item.pay_amount || '';
        document.getElementById('inputPayStatus').value = item.pay_status || '대기';
        document.getElementById('inputGuideText').value = item.guide_text || '';
        selectedRefIds = new Set((item.ref_ids || []).map(String));
      } else {
        editingId = null;
        document.getElementById('modalTitle').innerText = '📝 콘텐츠 기획서 작성';
        document.getElementById('saveBtn').innerText = '기획서 저장하기';
        selectedRefIds.clear();
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputPlatform').value = '인스타그램';
        document.getElementById('inputStatus').value = '아이디어';
        document.getElementById('inputScheduleType').value = '일반마감';
        document.getElementById('inputDueDate').value = '';
        document.getElementById('inputPayAmount').value = '';
        document.getElementById('inputPayStatus').value = '대기';
        document.getElementById('inputGuideText').value = '';
      }
      renderSelectedRefs();
      document.getElementById('planModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('planModal').classList.add('hidden');
    }

    function duplicatePlan(item, event) {
      if (event) event.stopPropagation();
      editingId = null;
      selectedRefIds = new Set((item.ref_ids || []).map(String));
      document.getElementById('modalTitle').innerText = '📋 기획 복사본 생성';
      document.getElementById('saveBtn').innerText = '기획서 저장하기';
      document.getElementById('inputTitle').value = `[복사본] ${item.title || ''}`;
      document.getElementById('inputPlatform').value = item.platform || '공통';
      document.getElementById('inputStatus').value = '아이디어';
      document.getElementById('inputScheduleType').value = item.schedule_type || '일반마감';
      document.getElementById('inputDueDate').value = '';
      document.getElementById('inputPayAmount').value = item.pay_amount || '';
      document.getElementById('inputPayStatus').value = '대기';
      document.getElementById('inputGuideText').value = item.guide_text || '';
      renderSelectedRefs();
      document.getElementById('planModal').classList.remove('hidden');
    }

    async function openRefPicker() {
      if (referenceList.length === 0) {
        const { data } = await supabaseClient.from('references').select('*');
        referenceList = data || [];
      }

      const listContainer = document.getElementById('refPickerList');
      listContainer.innerHTML = referenceList.map(ref => {
        const isChecked = selectedRefIds.has(String(ref.id));
        const firstImg = (ref.image_urls && ref.image_urls.length > 0) ? ref.image_urls[0] : (ref.image_url || '');

        return `
          <div onclick="toggleRefSelect('${ref.id}')" class="p-2.5 border rounded-xl flex items-center justify-between cursor-pointer transition ${isChecked ? 'border-indigo-600 bg-indigo-50/70 dark:bg-indigo-950/40' : 'hover:bg-slate-50 dark:hover:bg-slate-800'}">
            <div class="flex items-center gap-3 overflow-hidden">
              ${firstImg ? `<img src="${firstImg}" class="w-12 h-12 object-cover rounded-xl flex-shrink-0 border">` : `<div class="w-12 h-12 bg-slate-100 dark:bg-slate-800 rounded-xl flex items-center justify-center text-slate-400 text-xs flex-shrink-0">📷</div>`}
              <div class="truncate">
                <p class="font-bold text-xs truncate text-slate-800 dark:text-slate-100">${ref.title || '제목 없음'}</p>
                <p class="text-[10px] text-slate-400 truncate mt-0.5">${(ref.tags || []).join(', ')}</p>
              </div>
            </div>
            <input type="checkbox" ${isChecked ? 'checked' : ''} class="accent-indigo-600 ml-2 w-4 h-4">
          </div>
        `;
      }).join('');

      document.getElementById('refModal').classList.remove('hidden');
    }

    function toggleRefSelect(id) {
      const strId = String(id);
      if (selectedRefIds.has(strId)) selectedRefIds.delete(strId);
      else selectedRefIds.add(strId);
      openRefPicker();
      renderSelectedRefs();
    }

    function closeRefPicker() {
      document.getElementById('refModal').classList.add('hidden');
    }

    function renderSelectedRefs() {
      const container = document.getElementById('selectedRefArea');
      if (selectedRefIds.size === 0) {
        container.innerHTML = `<span class="text-[11px] text-slate-400">선택된 레퍼런스가 없습니다.</span>`;
        return;
      }

      const selectedItems = referenceList.filter(r => selectedRefIds.has(String(r.id)));
      container.innerHTML = selectedItems.map(r => `
        <span class="bg-indigo-100 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 text-[10px] px-2 py-0.5 rounded-md font-bold border border-indigo-200/50">
          #${r.title || '레퍼런스'}
        </span>
      `).join('');
    }

    async function savePlan() {
      const title = document.getElementById('inputTitle').value.trim();
      const platform = document.getElementById('inputPlatform').value;
      const status = document.getElementById('inputStatus').value;
      const schedule_type = document.getElementById('inputScheduleType').value;
      const rawDueDate = document.getElementById('inputDueDate').value;
      const due_date = rawDueDate ? rawDueDate : null;
      const pay_amount = Number(document.getElementById('inputPayAmount').value) || 0;
      const pay_status = document.getElementById('inputPayStatus').value;
      const guide_text = document.getElementById('inputGuideText').value.trim();

      if (!title) return alert('기획 제목을 입력해주세요.');

      const payload = { 
        title, platform, status, due_date, pay_amount, pay_status, guide_text, 
        ref_ids: Array.from(selectedRefIds),
        memo_type: 'plan' 
      };

      let res = editingId 
        ? await supabaseClient.from('content_plans').update({ ...payload, schedule_type }).eq('id', editingId)
        : await supabaseClient.from('content_plans').insert([{ ...payload, schedule_type }]);

      if (res.error && res.error.message.includes('schedule_type')) {
        res = editingId 
          ? await supabaseClient.from('content_plans').update(payload).eq('id', editingId)
          : await supabaseClient.from('content_plans').insert([payload]);
      }

      if (res.error) {
        alert('저장 실패: ' + res.error.message);
        return;
      }

      closeModal();
      loadData();
    }

    async function deleteItem(id, event = null) {
      if (event) event.stopPropagation();
      if (!confirm('삭제하시겠습니까?')) return;
      await supabaseClient.from('content_plans').delete().eq('id', id);
      loadData();
    }

    async function loadData() {
      const { data } = await supabaseClient.from('content_plans').select('*');
      cachedData = (data || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      const { data: refData } = await supabaseClient.from('references').select('*');
      referenceList = refData || [];

      calculateDashboard();
      if (currentTab === 'calendar') renderCalendar();
      renderList();
    }

    function calculateDashboard() {
      let done = 0;
      let pending = 0;
      cachedData.forEach(i => {
        if (i.memo_type === 'plan' && i.pay_amount) {
          if (i.pay_status === '완료') done += Number(i.pay_amount);
          else pending += Number(i.pay_amount);
        }
      });
      document.getElementById('totalDonePay').innerText = `${done.toLocaleString()}원`;
      document.getElementById('totalPendingPay').innerText = `${pending.toLocaleString()}원`;
    }

    function changeMonth(delta) {
      calDate.setMonth(calDate.getMonth() + delta);
      renderCalendar();
    }

    function getTagColorClass(sType) {
      switch(sType) {
        case '블로그방문': return 'bg-emerald-500 text-white';
        case '블로그마감': return 'bg-teal-600 text-white';
        case '인스타방문': return 'bg-purple-500 text-white';
        case '인스타마감': return 'bg-pink-500 text-white';
        default: return 'bg-indigo-500 text-white';
      }
    }

    function renderCalendar() {
      const year = calDate.getFullYear();
      const month = calDate.getMonth();
      document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="h-20 p-1 border border-transparent"></div>`;
      }

      for (let date = 1; date <= lastDate; date++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        const dayPlans = cachedData.filter(i => i.due_date === dateStr && i.memo_type === 'plan');

        grid.innerHTML += `
          <div class="h-20 p-1.5 border border-slate-100 dark:border-slate-800 rounded-xl flex flex-col justify-start overflow-hidden bg-slate-50/50 dark:bg-slate-800/30">
            <span class="font-bold text-[11px] text-slate-500">${date}</span>
            <div class="space-y-1 overflow-y-auto no-scrollbar mt-0.5">
              ${dayPlans.map(p => `
                <div onclick='openModal(${JSON.stringify(p).replace(/'/g, "&apos;")})' class="text-[9px] font-bold truncate ${getTagColorClass(p.schedule_type)} px-1.5 py-0.5 rounded-md leading-tight cursor-pointer hover:opacity-90 transition">
                  ${p.title}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    function getDDay(dateStr) {
      if (!dateStr) return '';
      const today = new Date();
      today.setHours(0,0,0,0);
      const target = new Date(dateStr);
      const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      if (diff === 0) return '<span class="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold shadow-sm">D-Day</span>';
      if (diff > 0) return `<span class="bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 text-[10px] px-2 py-0.5 rounded-full font-bold">D-${diff}</span>`;
      return `<span class="bg-slate-200 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold">마감지남</span>`;
    }

    // 🚀 레퍼런스 창고의 [링크 바로가기 ↗]와 100% 동일한 새창 이동 실행 함수
    function goToRefLink(refId, event) {
      if (event) event.stopPropagation();
      const ref = referenceList.find(r => String(r.id) === String(refId));
      if (!ref) return;

      // references 테이블에 저장된 링크 값 추출
      let targetUrl = ref.link || ref.url || ref.source_url || ref.link_url || ref.original_url || ref.post_url || '';

      if (!targetUrl || typeof targetUrl !== 'string' || !targetUrl.trim()) {
        alert('이 레퍼런스에 등록된 바로가기 링크가 없습니다.');
        return;
      }

      targetUrl = targetUrl.trim();
      if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        targetUrl = 'https://' + targetUrl;
      }

      window.open(targetUrl, '_blank', 'noopener,noreferrer');
    }

    function renderList() {
      const container = document.getElementById('contentList');
      if (currentTab === 'calendar') {
        container.innerHTML = '';
        return;
      }

      const filtered = cachedData.filter(i => (i.memo_type || 'plan') === currentTab);

      if (filtered.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center py-12 text-xs text-slate-400 font-medium">저장된 데이터가 없습니다.</p>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        if (currentTab === 'quick_memo') {
          return `
            <div class="col-span-1 p-4 bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200/80 rounded-2xl flex items-center justify-between gap-2 shadow-sm">
              <p class="text-xs font-semibold text-slate-800 dark:text-slate-200 flex-1 leading-relaxed">${item.title}</p>
              <div class="flex items-center gap-1 flex-shrink-0">
                <button onclick="editQuickMemo(${item.id}, '${item.title.replace(/'/g, "\\'")}')" class="p-1 hover:bg-amber-200/50 rounded-lg text-slate-500 hover:text-amber-700 text-xs font-bold transition">✏️</button>
                <button onclick="deleteItem(${item.id})" class="p-1 hover:bg-rose-100 rounded-lg text-slate-400 hover:text-rose-500 text-sm font-bold transition">&times;</button>
              </div>
            </div>
          `;
        }

        const linkedRefs = referenceList.filter(r => (item.ref_ids || []).map(String).includes(String(r.id)));

        return `
          <div class="p-4 sm:p-5 bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl space-y-3 shadow-sm hover:shadow-md transition relative flex flex-col justify-between">
            <div class="space-y-2.5">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-1.5 flex-wrap">
                  ${getDDay(item.due_date)}
                  <span class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-md font-bold">${item.platform || '공통'}</span>
                  <span class="text-[10px] bg-indigo-50 text-indigo-600 dark:bg-indigo-950/80 dark:text-indigo-300 px-2 py-0.5 rounded-md font-bold">${item.status}</span>
                </div>
                <div class="flex items-center gap-1">
                  <button onclick='openModal(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="px-2 py-1 bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 rounded-lg text-xs font-bold transition">
                    ✏️
                  </button>
                  <button onclick="deleteItem(${item.id}, event)" class="p-1 text-slate-300 hover:text-rose-500 text-lg font-bold transition">&times;</button>
                </div>
              </div>

              <h3 class="font-extrabold text-xs sm:text-sm text-slate-900 dark:text-white leading-snug">${item.title}</h3>

              ${item.pay_amount ? `
                <div class="flex items-center justify-between text-xs bg-slate-50 dark:bg-slate-800/40 p-2.5 rounded-xl">
                  <span class="font-extrabold text-slate-800 dark:text-slate-200">💵 ${Number(item.pay_amount).toLocaleString()}원</span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${item.pay_status === '완료' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                    ${item.pay_status === '완료' ? '🟢 완료' : '⏳ 대기'}
                  </span>
                </div>
              ` : ''}

              <!-- 🔗 레퍼런스 창고의 '링크 바로가기'와 동일한 원본 링크 새창 실행 버튼 -->
              ${linkedRefs.length > 0 ? `
                <div class="flex flex-wrap gap-1.5 pt-0.5">
                  ${linkedRefs.map(r => `
                    <button type="button" onclick="goToRefLink('${r.id}', event)" class="bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 text-[10px] px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 transition border border-indigo-100 dark:border-indigo-900 cursor-pointer">
                      🔗 ${r.title || '링크 바로가기'} ↗
                    </button>
                  `).join('')}
                </div>
              ` : ''}

              ${item.guide_text ? `
                <div class="bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800 text-[11px] text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed">
                  <span class="font-extrabold text-indigo-600 dark:text-indigo-400 block mb-0.5">🤝 가이드:</span>${item.guide_text}
                </div>
              ` : ''}
            </div>

            <div class="pt-2 flex justify-end border-t border-slate-100 dark:border-slate-800/50 mt-2">
              <button onclick='duplicatePlan(${JSON.stringify(item).replace(/'/g, "&apos;")}, event)' class="text-[11px] font-bold text-slate-500 hover:text-indigo-600 bg-slate-100 dark:bg-slate-800 hover:bg-indigo-50 px-2.5 py-1 rounded-xl transition">
                📋 복사
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
